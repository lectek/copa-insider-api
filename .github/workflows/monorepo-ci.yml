name: Monorepo CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: monorepo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      saude: ${{ steps.filter.outputs.saude }}
      lekteck: ${{ steps.filter.outputs.lekteck }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            saude:
              - 'src/**'
              - 'pom.xml'
              - 'mvnw'
              - '.mvn/**'
              - 'apps/saudemaisfarma-api/**'
              - 'pom.monorepo.xml'
            lekteck:
              - 'apps/lekteck-api/**'
              - 'pom.monorepo.xml'
            shared:
              - 'libs/shared-kernel/**'

  build-saude:
    needs: changes
    if: ${{ needs.changes.outputs.saude == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify SaudeMaisFarma module
        run: ./mvnw -B -DskipITs clean verify

  build-lekteck:
    needs: changes
    if: ${{ needs.changes.outputs.lekteck == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Lekteck multitenant module
        run: ./mvnw -B -f pom.monorepo.xml -pl apps/lekteck-api -am test
