# (Opcional) Remova a linha "version" para evitar o warning do Compose moderno
# version: "3.9"

name: redemaisfarma-api-dev

networks:
  backend-net:
    driver: bridge

volumes:
  mysql_data_dev:
  redis_data_dev:
  app_logs_dev:
  app_media_dev:
  nominatim_db_dev:
  nominatim_flatnode_dev:

services:
  nominatim:
    image: mediagis/nominatim:5.2
    container_name: redemaisfarma-nominatim-dev
    restart: unless-stopped
    profiles: ["routing"]
    shm_size: 1gb
    environment:
      PBF_PATH: "/nominatim/data/${NOMINATIM_PBF_FILE:-paraiba-latest.osm.pbf}"
      NOMINATIM_PASSWORD: "${NOMINATIM_PASSWORD:-nominatim}"
      THREADS: "${NOMINATIM_THREADS:-2}"
      IMPORT_WIKIPEDIA: "${NOMINATIM_IMPORT_WIKIPEDIA:-false}"
      UPDATE_MODE: "${NOMINATIM_UPDATE_MODE:-none}"
      POSTGRES_SHARED_BUFFERS: "${NOMINATIM_POSTGRES_SHARED_BUFFERS:-512MB}"
      POSTGRES_MAINTENANCE_WORK_MEM: "${NOMINATIM_POSTGRES_MAINTENANCE_WORK_MEM:-512MB}"
      POSTGRES_AUTOVACUUM_WORK_MEM: "${NOMINATIM_POSTGRES_AUTOVACUUM_WORK_MEM:-256MB}"
      POSTGRES_WORK_MEM: "${NOMINATIM_POSTGRES_WORK_MEM:-32MB}"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "${NOMINATIM_POSTGRES_EFFECTIVE_CACHE_SIZE:-1024MB}"
      POSTGRES_MAX_WAL_SIZE: "${NOMINATIM_POSTGRES_MAX_WAL_SIZE:-1024MB}"
      POSTGRES_CHECKPOINT_TIMEOUT: "${NOMINATIM_POSTGRES_CHECKPOINT_TIMEOUT:-10min}"
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: "${NOMINATIM_POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}"
    ports:
      - "${HOST_NOMINATIM_PORT:-8088}:8080"
    volumes:
      - nominatim_db_dev:/var/lib/postgresql/16/main
      - nominatim_flatnode_dev:/nominatim/flatnode
      - ./infra/nominatim/data:/nominatim/data:ro
    networks: [backend-net]

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: redemaisfarma-osrm-dev
    restart: unless-stopped
    profiles: ["routing"]
    command:
      [
        "osrm-routed",
        "--algorithm",
        "mld",
        "/data/${OSRM_DATA_FILE:-paraiba-latest.osrm}"
      ]
    ports:
      - "${HOST_OSRM_PORT:-5000}:5000"
    volumes:
      - ./infra/osrm/data:/data:ro
    networks: [backend-net]

  mysql:
    image: mysql:8.0
    container_name: redemaisfarma-mysql-dev
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --host_cache_size=0
      --log_bin_trust_function_creators=1
      --innodb-buffer-pool-size=256M
      --table-open-cache=200
      --max-connections=120
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Rede_Mais_Farma25@}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST:-%}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-redemaisfarma}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Rede_Mais_Farma25@}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${HOST_MYSQL_PORT:-3310}:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER:-app_user} -p${MYSQL_PASSWORD:-Rede_Mais_Farma25@} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [backend-net]
    # 'deploy.resources' é ignorado fora do Swarm; se quiser mesmo limitar,
    # use Docker Desktop/Swarm. Mantive comentado para não quebrar.
    # deploy:
    #   resources:
    #     reservations:
    #       memory: 512M

  mailpit:
    image: axllent/mailpit:latest
    container_name: redemaisfarma-mailpit-dev
    restart: unless-stopped
    ports:
      - "${HOST_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${HOST_MAILPIT_UI_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD-SHELL","wget --spider -q http://127.0.0.1:8025/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks: [backend-net]

  redis:
    image: redis:7-alpine
    container_name: redemaisfarma-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${HOST_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks: [backend-net]

  cliente-mock:
    image: wiremock/wiremock:3.8.0
    container_name: redemaisfarma-cliente-mock-dev
    restart: unless-stopped
    command: ["--verbose","--global-response-templating"]
    ports:
      - "${HOST_CLIENTE_MOCK_PORT:-8081}:8080"
    volumes:
      - ./infra/wiremock:/home/wiremock
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1:8080/__admin | grep -q 'mappings'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks: [backend-net]

  app:
    container_name: redemaisfarma-app-dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      cliente-mock:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Sao_Paulo}

      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_OPTS: "--spring.output.ansi.enabled=ALWAYS --spring.profiles.active=${SPRING_PROFILES_ACTIVE:-dev}"

      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: "-Dserver.address=0.0.0.0"

      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-redemaisfarma}?sslMode=PREFERRED&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_USER:-app_user}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD:-Rede_Mais_Farma25@}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"

      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-redemaisfarma}?sslMode=PREFERRED&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_FLYWAY_USER: "${MYSQL_USER:-app_user}"
      SPRING_FLYWAY_PASSWORD: "${MYSQL_PASSWORD:-Rede_Mais_Farma25@}"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

      KAFKA_ENABLED: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      LEGACY_SYNC_ENABLED: "false"

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,mappings,loggers"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: "always"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "true"

      APP_MAIL_ENABLED: "true"
      APP_MAIL_FROM: "${APP_MAIL_FROM:-no-reply@local.redemaisfarma}"
      SPRING_MAIL_HOST: "mailpit"
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
      SPRING_MAIL_PROPERTIES_MAIL_DEBUG: "false"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"

      APP_WEB_BASE_URL: "${APP_WEB_BASE_URL:-http://localhost:18090}"
      APP_MEDIA_PROVIDER: "${APP_MEDIA_PROVIDER:-local}"
      APP_MEDIA_DIR: "${APP_MEDIA_DIR:-/opt/app/media/products}"
      APP_MEDIA_PUBLIC_BASE: "${APP_MEDIA_PUBLIC_BASE:-/media/products}"
      APP_MEDIA_USER_DIR: "${APP_MEDIA_USER_DIR:-/opt/app/media/users}"
      APP_MEDIA_USER_PUBLIC_BASE: "${APP_MEDIA_USER_PUBLIC_BASE:-/media/users}"
      APP_ROUTE_ENGINE: "${APP_ROUTE_ENGINE:-geo}"
      APP_ROUTE_OSRM_BASE_URL: "${APP_ROUTE_OSRM_BASE_URL:-http://osrm:5000}"
      # Quando o profile "routing" estiver ativo, sobrescreva para http://nominatim:8080/search
      APP_ROUTE_NOMINATIM_BASE_URL: "${APP_ROUTE_NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org/search}"

      INTEGRATIONS_CLIENTE_BASE_URL: "http://cliente-mock:8080"
      INTEGRATIONS_CLIENTE_BASEURL: "http://cliente-mock:8080"
      ESTOQUE_FISICO_CSV_PATH: "/data/Estoque Fisico.csv"

      LOG_PATH: "/tmp"
      ACCESS_FILE: "access.log"

      JWT_SECRET: "${JWT_SECRET:-dev-docker-please-change-this-very-long-64chars-secret-1234567890-ABCdef}"
      JWT_ISSUER: "${JWT_ISSUER:-redemaisfarma-api}"
      JWT_ACCESS_TOKEN_TTL_SECONDS: "${JWT_ACCESS_TOKEN_TTL_SECONDS:-3600}"
      JWT_REFRESH_TOKEN_TTL_SECONDS: "${JWT_REFRESH_TOKEN_TTL_SECONDS:-2592000}"

      SPRING_APPLICATION_JSON: |
        {
          "jwt.secret": "${JWT_SECRET:-dev-docker-please-change-this-very-long-64chars-secret-1234567890-ABCdef}",
          "jwt.issuer": "${JWT_ISSUER:-redemaisfarma-api}"
        }

      SERVER_SERVLET_ENCODING_ENABLED: "true"
      SERVER_SERVLET_ENCODING_FORCE: "true"
      SERVER_SERVLET_ENCODING_CHARSET: "UTF-8"
      SPRING_MESSAGES_ENCODING: "UTF-8"
      SPRING_JACKSON_TIME_ZONE: "${TZ:-America/Sao_Paulo}"

    ports:
      - "${APP_HTTP_PORT:-18090}:8080"
    healthcheck:
      # Usa liveness para evitar dependências externas no healthcheck do container.
      test: ["CMD-SHELL","curl -fsS http://127.0.0.1:8080/actuator/health/liveness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [backend-net]
    volumes:
      - app_logs_dev:/opt/app/logs
      - app_media_dev:/opt/app/media
      - "./Estoque Fisico.csv:/app/Estoque Fisico.csv:ro"
      - "./Estoque Fisico.csv:/data/Estoque Fisico.csv:ro"
    # deploy.resources é ignorado fora do Swarm; manter comentado
    # deploy:
    #   resources:
    #     reservations:
    #       memory: 512M
