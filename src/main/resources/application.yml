spring:
  profiles:
    default: dev
    group:
      dev: dev,legacy
      prod-oauth2: prod,docker,oauth2

  main:
    web-application-type: servlet

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
          timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:10000}
          quitwait: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_QUITWAIT:false}

  kafka:
    # Para desenvolvimento fora de Docker, localhost:9092
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${app.kafka.groups.pedidos:pedidos-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: br.com.lectek.copainsider.*
        spring.json.use.type.headers: true
    listener:
      missing-topics-fatal: false

  task:
    scheduling:
      pool:
        size: 2

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /docs
    filter: true
    try-it-out-enabled: true
    display-request-duration: true
    deep-linking: true
    doc-expansion: none
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
    default-models-expand-depth: -1
    default-model-expand-depth: 2
    custom-css-url: /swagger-ui/swagger-custom.css
    custom-js: /swagger-ui/swagger-custom.js
  show-actuator: true
  cache:
    disabled: true
  group-configs:
    - group: public
      paths-to-match: /api/public/**
    - group: admin
      paths-to-match: /api/admin_**, /api/private_**, /api/admin/**, /api/private/**
    - group: export
      paths-to-match: /api/export/**
    - group: actuator
      paths-to-match: /actuator/**

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
    include-exception: true

management:
  server:
    # Mantém o Actuator na MESMA porta do app para casar com o healthcheck do container
    port: ${MANAGEMENT_SERVER_PORT:${PORT:${SERVER_PORT:8080}}}
  endpoints:
    web:
      base-path: /actuator
      # Exponha health e info (suficiente para liveness/readiness)
      exposure:
        include: health,info
  endpoint:
    health:
      # Mostra detalhes só localmente; mude para "never" se não quiser vazar detalhes
      show-details: always
      probes:
        enabled: true
    loggers:
      enabled: true

# JWT – mantidos os dois blocos porque o projeto aparenta ler ambos
security:
  jwt:
    enabled: ${JWT_ENABLED:false}
    issuer: ${JWT_ISSUER:copainsider-api}
    secret: ${JWT_SECRET:dev-secret}
    access-token:
      ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token:
      ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}

jwt:
  enabled: ${JWT_ENABLED:false}
  issuer: ${JWT_ISSUER:copainsider-api}
  secret: ${JWT_SECRET:dev-secret}
  accessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
  refreshTokenExpirationMinutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:43200}

app:
  config:
    envProfileLabel: ${APP_CONFIG_ENV_PROFILE_LABEL:dev}
    networkPortLabel: ${APP_CONFIG_NETWORK_PORT_LABEL:8080}
  security:
    oauth2:
      enabled: false
      post-login-redirect: /
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:8080}
  media:
    provider: ${APP_MEDIA_PROVIDER:local}
    dir: ${APP_MEDIA_DIR:media/products}
    public-base: ${APP_MEDIA_PUBLIC_BASE:/media/products}
    user-dir: ${APP_MEDIA_USER_DIR:media/users}
    user-public-base: ${APP_MEDIA_USER_PUBLIC_BASE:/media/users}
    s3:
      bucket: ${APP_MEDIA_S3_BUCKET:}
      region: ${APP_MEDIA_S3_REGION:us-east-1}
      endpoint: ${APP_MEDIA_S3_ENDPOINT:}
      access-key: ${APP_MEDIA_S3_ACCESS_KEY:}
      secret-key: ${APP_MEDIA_S3_SECRET_KEY:}
      path-style-access: ${APP_MEDIA_S3_PATH_STYLE_ACCESS:true}
      product-prefix: ${APP_MEDIA_S3_PRODUCT_PREFIX:products}
      user-prefix: ${APP_MEDIA_S3_USER_PREFIX:users}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@local.copainsider}
  sms:
    enabled: ${APP_SMS_ENABLED:false}
    provider: ${APP_SMS_PROVIDER:twilio}
    from: ${APP_SMS_FROM:}
    default-country-code: ${APP_SMS_DEFAULT_COUNTRY_CODE:55}
    twilio:
      account-sid: ${APP_SMS_TWILIO_ACCOUNT_SID:${TWILIO_ACCOUNT_SID:}}
      auth-token: ${APP_SMS_TWILIO_AUTH_TOKEN:${TWILIO_AUTH_TOKEN:}}
      messaging-service-sid: ${APP_SMS_TWILIO_MESSAGING_SERVICE_SID:${TWILIO_MESSAGING_SERVICE_SID:}}
  ai:
    assistant:
      provider: ${APP_AI_ASSISTANT_PROVIDER:openai}
    openai:
      enabled: ${APP_AI_OPENAI_ENABLED:true}
      base-url: ${APP_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      chat-model: ${APP_AI_OPENAI_CHAT_MODEL:gpt-5-mini}
      vision-model: ${APP_AI_OPENAI_VISION_MODEL:gpt-5-mini}
      image-model: ${APP_AI_OPENAI_IMAGE_MODEL:gpt-image-1.5}
      reasoning-effort: ${APP_AI_OPENAI_REASONING_EFFORT:low}
      timeout-ms: ${APP_AI_OPENAI_TIMEOUT_MS:30000}
      store-responses: ${APP_AI_OPENAI_STORE_RESPONSES:true}
      system-prompt: ${APP_AI_OPENAI_SYSTEM_PROMPT:Voce e Alysson, o assistente virtual da CopaInsider. Responda em portugues natural, acolhedor e profissional. Soe humano, simpatico e confiante, sem parecer robotico. Use frases curtas, fluidas e conversacionais. Reconheca o que o cliente acabou de dizer antes de orientar o proximo passo. Demonstre leve entusiasmo quando fizer sentido, mas sem exagero. Mantenha o contexto da conversa e nao se reapresente a cada mensagem. Quando perguntarem seu nome, responda que seu nome e Alysson. Para frete, prazo ou entrega, aceite CEP ou endereco completo com rua, numero, bairro e cidade. Se o cliente enviar apenas o CEP, reconheca o CEP recebido e continue a conversa sem reiniciar o atendimento. Faca uma pergunta objetiva por vez. Nao invente estoque, preco, prazo, diagnostico ou promessas operacionais. Se o cliente pedir diagnostico, prescricao ou orientacao medica, deixe claro que nao substitui um profissional de saude.}
      product-vision-prompt: ${APP_AI_OPENAI_PRODUCT_VISION_PROMPT:Analise profundamente a imagem enviada e pesquise o produto com base nos identificadores disponiveis antes de escrever o prompt final. Confirme marca, nome do produto, variante, concentracao, volume, sabor, quantidade, formato da embalagem, cores, tipografia e selos oficiais. Escreva somente um prompt curto para gerar um packshot fiel do produto em fundo branco puro com sombreamento basico suave de estudio para ecommerce.}
      image-quality: ${APP_AI_OPENAI_IMAGE_QUALITY:medium}
      image-size: ${APP_AI_OPENAI_IMAGE_SIZE:1024x1024}
      image-background: ${APP_AI_OPENAI_IMAGE_BACKGROUND:opaque}
      image-output-format: ${APP_AI_OPENAI_IMAGE_OUTPUT_FORMAT:png}
    image:
      provider: ${APP_AI_IMAGE_PROVIDER:openai}
      pollinations:
        base-url: ${APP_AI_IMAGE_POLLINATIONS_BASE_URL:https://image.pollinations.ai/prompt}
        model: ${APP_AI_IMAGE_POLLINATIONS_MODEL:flux}
        width: ${APP_AI_IMAGE_POLLINATIONS_WIDTH:1024}
        height: ${APP_AI_IMAGE_POLLINATIONS_HEIGHT:1024}
        nologo: ${APP_AI_IMAGE_POLLINATIONS_NOLOGO:true}
        private: ${APP_AI_IMAGE_POLLINATIONS_PRIVATE:false}
  route:
    engine: ${APP_ROUTE_ENGINE:auto}
    nominatim:
      base-url: ${APP_ROUTE_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org/search}
      user-agent: ${APP_ROUTE_NOMINATIM_USER_AGENT:CopaInsider/1.0}
      timeout-ms: ${APP_ROUTE_NOMINATIM_TIMEOUT_MS:6000}
    osrm:
      base-url: ${APP_ROUTE_OSRM_BASE_URL:http://localhost:5000}
  kafka:
    groups:
      pedidos: ${APP_KAFKA_GROUP_PEDIDOS:pedidos-consumer}
legacy:
  sync:
    enabled: ${LEGACY_SYNC_ENABLED:false}

catalogo-venda:
  local:
    resource: ${CATALOGO_VENDA_LOCAL_RESOURCE:classpath:catalogo/catalogo-venda-local.tsv}
    bootstrap-enabled: ${CATALOGO_VENDA_LOCAL_BOOTSTRAP_ENABLED:false}

api:
  base-path: /api
  version: v2

---
# Overrides para rodar DENTRO do Docker (profile: docker)
spring:
  config:
    activate:
      on-profile: docker

  kafka:
    # Usa o broker do Compose (porta 9094 exposta pelo Bitnami com KRaft)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:copainsider-kafka-dev:9094}
    listener:
      # Se quiser garantir startup mesmo sem Kafka, deixe true; ajuste depois conforme necessidade
      missing-topics-fatal: false
      # Opcional: desligar listeners na subida do container até estabilizar o ambiente
      # auto-startup: false

  mail:
    host: ${SPRING_MAIL_HOST:copainsider-mailpit-dev}
    port: ${SPRING_MAIL_PORT:8025}

management:
  server:
    # Mantém 8080 para alinhar com o healthcheck (http://127.0.0.1:8080/actuator/health/liveness)
    port: ${MANAGEMENT_SERVER_PORT:8080}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
