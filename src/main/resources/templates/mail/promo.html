<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Promocao</title>
</head>
<body>
  <div th:replace="mail/base :: layout(~{::section})">
    <section>
      <h1 th:text="${headline} ?: 'Oferta especial para voce'">Oferta especial para voce</h1>
      <p th:text="${message} ?: 'Confira as condicoes desta campanha e aproveite.'">
        Confira as condicoes desta campanha e aproveite.
      </p>

      <ul th:if="${highlights != null}">
        <li th:each="h : ${highlights}" th:text="${h}">Destaque</li>
      </ul>

      <p th:if="${couponCode}">
        Cupom: <strong th:text="${couponCode}">CUPOM10</strong>
      </p>

      <p th:if="${ctaUrl}">
        <a class="btn" th:href="${ctaUrl}" th:text="${ctaLabel} ?: 'Ver oferta'">Ver oferta</a>
      </p>
    </section>
  </div>
</body>
</html>
