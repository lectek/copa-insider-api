<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Email</title>
  <style>
    body{margin:0;padding:0;background:#f5f7fb;font-family:Arial, sans-serif;color:#1f2933}
    .wrap{max-width:640px;margin:0 auto;padding:24px}
    .card{background:#ffffff;border-radius:12px;box-shadow:0 6px 18px rgba(15,23,42,.08);overflow:hidden}
    .header{padding:20px 24px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px}
    .logo{width:40px;height:40px;object-fit:contain;border-radius:8px}
    .brand{font-weight:700;font-size:16px}
    .content{padding:24px}
    .btn{display:inline-block;background:#0ea5e9;color:#fff;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:700}
    .muted{color:#6b7280;font-size:13px}
    .footer{padding:20px 24px;border-top:1px solid #e5e7eb}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <img class="logo" th:if="${logoUrl}" th:src="${logoUrl}" alt="Logo"/>
        <div class="brand" th:text="${appCompanyName} ?: 'RedeMaisFarma'">RedeMaisFarma</div>
      </div>

      <div class="content" th:fragment="layout(content)">
        <div th:replace="${content}"></div>
      </div>

      <div class="footer">
        <div class="muted">
          <span th:text="${appCompanyName} ?: 'RedeMaisFarma'">RedeMaisFarma</span>
          <span th:if="${siteUrl}"> - <a th:href="${siteUrl}" th:text="${siteUrl}">site</a></span>
        </div>
        <div class="muted" th:if="${supportEmail}">
          Suporte: <span th:text="${supportEmail}">suporte@exemplo.com</span>
        </div>
        <div class="muted">Este email foi enviado automaticamente.</div>
      </div>
    </div>
  </div>
</body>
</html>
