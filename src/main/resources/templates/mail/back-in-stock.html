<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Produto voltou ao estoque</title>
</head>
<body style="font-family: sans-serif; color: #222;">
  <h2 th:text="${headline} ?: 'O produto que você acompanha voltou ao estoque'">
    O produto que você acompanha voltou ao estoque
  </h2>
  <p th:text="${message} ?: 'Aproveite antes que acabe novamente.'">
    Aproveite antes que acabe novamente.
  </p>
  <p>
    Produto: <strong th:text="${produtoNome}">Nome do produto</strong><br/>
    Categoria: <span th:text="${categoria}">Categoria</span>
  </p>
  <p>
    <span>Queremos avisar que esse item está disponível novamente.</span>
  </p>
</body>
</html>
