<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Status do pedido</title>
</head>
<body>
  <div th:replace="mail/base :: layout(~{::section})">
    <section>
      <h1>Status do pedido</h1>
      <p>
        Pedido: <strong th:text="${orderId}">#0000</strong><br/>
        Status: <strong th:text="${status}">Confirmado</strong>
      </p>

      <p th:if="${total}">
        Total: <strong th:text="${total}">R$ 0,00</strong>
      </p>

      <div th:if="${items != null}">
        <p>Itens:</p>
        <ul>
          <li th:each="i : ${items}" th:text="${i}">Produto</li>
        </ul>
      </div>

      <p th:if="${trackingUrl}">
        <a class="btn" th:href="${trackingUrl}">Acompanhar pedido</a>
      </p>
    </section>
  </div>
</body>
</html>
