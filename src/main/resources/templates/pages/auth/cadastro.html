<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body class="ci-body ci-body--auth">

<div class="ci-auth-page">
    <div class="ci-auth-card">
        <div class="ci-auth-card__brand">
            <a href="/" class="ci-brand-link">
                <span class="ci-brand-badge">CI</span>
                <span class="ci-brand-name">Copa Insider</span>
            </a>
        </div>
        <h1 class="ci-auth-card__title">Criar conta</h1>
        <p class="ci-auth-card__sub">Grátis. Entre no jogo agora.</p>

        <div th:replace="~{fragments/flash :: flash}"></div>

        <form th:action="@{/cadastro}" method="post" class="ci-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="ci-form__field">
                <label class="ci-form__label" for="nome">Nome completo</label>
                <input id="nome" name="nome" type="text"
                       class="ci-form__input" placeholder="Seu nome"
                       autocomplete="name" required autofocus/>
            </div>

            <div class="ci-form__field">
                <label class="ci-form__label" for="email">E-mail</label>
                <input id="email" name="email" type="email"
                       class="ci-form__input" placeholder="seu@email.com"
                       autocomplete="email" required/>
            </div>

            <div class="ci-form__field">
                <label class="ci-form__label" for="senha">Senha</label>
                <input id="senha" name="senha" type="password"
                       class="ci-form__input" placeholder="Mínimo 8 caracteres"
                       autocomplete="new-password" minlength="8" required/>
            </div>

            <div class="ci-form__field">
                <label class="ci-form__label" for="confirmarSenha">Confirmar senha</label>
                <input id="confirmarSenha" name="confirmarSenha" type="password"
                       class="ci-form__input" placeholder="Repita a senha"
                       autocomplete="new-password" required/>
            </div>

            <div class="ci-form__field">
                <label class="ci-form__label" for="codigoAcesso">
                    Código de acesso
                    <span class="ci-form__optional">(opcional)</span>
                </label>
                <input id="codigoAcesso" name="codigoAcesso" type="text"
                       class="ci-form__input" placeholder="XXXXXXXXXXXXXXXX"
                       maxlength="20" autocomplete="off"
                       style="text-transform:uppercase;letter-spacing:.12em;font-family:monospace;font-size:15px;"/>
                <span class="ci-form__hint">Recebeste um código após a compra? Introduz aqui para ativar o acesso.</span>
            </div>

            <button type="submit" class="ci-btn ci-btn--primary ci-btn--full"
                    data-loading-text="A criar conta…">Criar conta</button>
        </form>

        <div th:if="${oauth2Enabled}" class="ci-auth-divider"><span>ou</span></div>
        <a th:if="${oauth2Enabled}" href="/oauth2/authorization/google"
           class="ci-btn ci-btn--full ci-btn--google">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continuar com Google
        </a>

        <p class="ci-auth-card__switch">
            Já tem conta? <a th:href="@{/auth/login}">Entrar</a>
        </p>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
