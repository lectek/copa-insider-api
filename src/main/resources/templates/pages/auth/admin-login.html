<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Admin — Entrar')}"></head>
<body class="ci-body ci-body--auth ci-body--admin-auth">

<div class="ci-auth-page">
    <div class="ci-auth-card">
        <div class="ci-auth-card__brand">
            <img th:src="@{/img/logo.svg}" alt="Copa Insider" class="ci-auth-card__logo"/>
            <span class="ci-auth-card__admin-badge">Admin</span>
        </div>
        <h1 class="ci-auth-card__title">Acesso Administrativo</h1>

        <div th:if="${param.error}" class="ci-flash ci-flash--error">
            Credenciais inválidas.
        </div>

        <form th:action="@{/admin/login}" method="post" class="ci-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="ci-form__field">
                <label class="ci-form__label" for="username">Usuário</label>
                <input id="username" name="username" type="text"
                       class="ci-form__input" autocomplete="username" required autofocus/>
            </div>

            <div class="ci-form__field">
                <label class="ci-form__label" for="password">Senha</label>
                <input id="password" name="password" type="password"
                       class="ci-form__input" autocomplete="current-password" required/>
            </div>

            <button type="submit" class="ci-btn ci-btn--primary ci-btn--full">Entrar</button>
        </form>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
