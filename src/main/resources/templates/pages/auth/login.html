<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:with="title='Entrar - Embalando Soluções em Enbalagens e Bomboniere'">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f4fa8" />

  <title th:text="${title} ?: 'Entrar - Embalando Soluções em Enbalagens e Bomboniere'">Entrar - Embalando Soluções em Enbalagens e Bomboniere</title>
  <meta name="description" content="Embalando Soluções em Enbalagens e Bomboniere: embalagens, descartaveis e bomboniere com entrega local e segura." />

  <link rel="canonical" href="/" />
  <link rel="icon" type="image/png" th:href="@{/images/favicon.png}" />
  <link rel="apple-touch-icon" th:href="@{/images/favicon-apple.png}" />

  <link rel="stylesheet" th:href="@{/css/main.css(v=${#dates.createNow().time})}" />
  <link rel="stylesheet" th:href="@{/css/pages/login.css(v=${#dates.createNow().time})}" />
</head>
<body class="body-flex login-page"
      th:style="'--space-900:' + (${loginClientBgStart} ?: '#04020f')
      + ';--space-800:' + (${loginClientBgMid} ?: '#071536')
      + ';--space-700:' + (${loginClientBgEnd} ?: '#0b2d64')">
  <main id="main-content" class="login-shell" tabindex="-1">
    <section class="login-stage" aria-label="Area de login">
      <header class="login-brand">
        <img class="login-brand-logo"
             th:src="${#strings.isEmpty(brandingLogoUrl) or #strings.containsIgnoreCase(brandingLogoUrl, 'logofarma.png') or #strings.containsIgnoreCase(brandingLogoUrl, 'logo-redemaisfarma.png') or #strings.containsIgnoreCase(brandingLogoUrl, 'novalogo.webp')} ? @{/images/logonova.png} : ${brandingLogoUrl}"
             alt="Embalando Soluções em Enbalagens e Bomboniere"
             loading="eager"
             decoding="async" />
      </header>

      <div class="login-layout">
        <section class="login-card" aria-labelledby="titulo-login">
          <h1 id="titulo-login" class="login-title">Entrar</h1>
          <p class="login-subtitle">Use seu e-mail e senha para acessar sua conta.</p>

          <div th:if="${param.error}" class="alert alert-login alert-login--error">Credenciais invalidas.</div>
          <div th:if="${param.logout}" class="alert alert-login alert-login--info">Sessao encerrada.</div>

          <form id="loginForm" th:action="@{/auth/login}" method="post" class="login-form" autocomplete="on" novalidate>
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="perfil" id="perfilInput" value="cliente"/>
            <input type="hidden" name="redirect" id="redirect" th:value="${redirectDefault} ?: '/cliente/conta'"/>

            <div class="field">
              <label class="visually-hidden" for="usuario">E-mail</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Zm2 0 6 4 6-4H6Zm12 12V9.2l-6 4-6-4V18h12Z"/></svg>
                </span>
                <input id="usuario" class="input" type="text" name="username" autocomplete="username"
                       placeholder="seu@email.com" required autofocus/>
              </div>
            </div>

            <div class="field">
              <label class="visually-hidden" for="senha">Senha</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 1 1 12 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Zm2 0h8V8a4 4 0 1 0-8 0v2Z"/></svg>
                </span>
                <input id="senha" class="input" type="password" name="password"
                       autocomplete="current-password" placeholder="Sua senha" required minlength="8" maxlength="128"/>
                <button type="button" class="toggle-pass" id="toggleSenha"
                        aria-pressed="false" aria-label="Mostrar senha">
                  <svg viewBox="0 0 24 24" class="toggle-icon"><path d="M12 5c5 0 9 4.5 10 7-1 2.5-5 7-10 7S3 14.5 2 12c1-2.5 5-7 10-7Zm0 3.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
                </button>
              </div>
            </div>

            <label class="remember">
              <input id="lembrarMe" type="checkbox" name="remember-me"/>
              <span>Lembrar de mim</span>
            </label>

            <div class="login-actions">
              <button id="entrarBtn" type="submit" class="btn btn--primary"
                      data-login-profile="cliente" data-redirect="/cliente/conta">Entrar</button>
              <button id="entrarAdminBtn" type="submit" class="btn btn--admin"
                      data-login-profile="admin" data-redirect="/admin/dashboard">Entrar como Admin</button>
            </div>

            <nav class="login-links" aria-label="Links de suporte">
              <a th:href="@{/auth/esqueci-senha}">Esqueceu a senha?</a>
              <a th:href="@{/auth/cliente/cadastro}">Criar conta</a>
            </nav>

            <div class="login-links login-links--secondary" th:if="${oauth2Enabled}">
              <a href="#usuario">Conectar com E-mail</a>
              <a th:href="@{/oauth2/authorization/facebook}">Conectar com Facebook</a>
            </div>
          </form>
        </section>

        <aside class="login-illustration" aria-hidden="true">
          <div class="login-mascot-shell">
            <video class="login-mascot-video"
                   autoplay
                   loop
                   muted
                   playsinline
                   preload="metadata"
                   tabindex="-1"
                   th:poster="@{/images/mascote-login.png}"
                   poster="/images/mascote-login.png">
              <source th:src="${#strings.isEmpty(loginAnimationUrl) ? '/animations/mascote-flow-loop.mp4' : loginAnimationUrl}"
                      src="/animations/mascote-flow-loop.mp4"
                      type="video/mp4" />
            </video>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const redirectInput = document.getElementById('redirect');
      const perfilInput = document.getElementById('perfilInput');

      function applySubmitTarget(button) {
        if (!button || !redirectInput || !perfilInput) {
          return;
        }
        perfilInput.value = button.dataset.loginProfile || 'cliente';
        redirectInput.value = button.dataset.redirect || '/cliente/conta';
      }

      document.querySelectorAll('[data-login-profile]').forEach((button) => {
        button.addEventListener('click', () => applySubmitTarget(button));
      });

      form?.addEventListener('submit', (event) => {
        if (event.submitter?.dataset?.loginProfile) {
          applySubmitTarget(event.submitter);
        }
      });

      document.getElementById('toggleSenha')?.addEventListener('click', (event) => {
        const input = document.getElementById('senha');
        if (!input) {
          return;
        }
        const button = event.currentTarget;
        const hidden = input.type === 'password';
        input.type = hidden ? 'text' : 'password';
        button.setAttribute('aria-pressed', hidden ? 'true' : 'false');
        button.setAttribute('aria-label', hidden ? 'Ocultar senha' : 'Mostrar senha');
      });
    })();
  </script>
</body>
</html>
