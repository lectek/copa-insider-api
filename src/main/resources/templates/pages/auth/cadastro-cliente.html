<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body class="ci-body ci-body--auth">
<div class="ci-auth-page">
    <div class="ci-auth-card">
        <img th:src="@{/img/logo.svg}" alt="Copa Insider" class="ci-auth-card__logo"/>
        <h1 class="ci-auth-card__title">Criar conta</h1>
        <div th:replace="~{fragments/flash :: flash}"></div>
        <form th:action="@{/cadastro}" method="post" class="ci-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="ci-form__field">
                <label class="ci-form__label" for="nome">Nome</label>
                <input id="nome" name="nome" type="text" class="ci-form__input" required autofocus/>
            </div>
            <div class="ci-form__field">
                <label class="ci-form__label" for="email">E-mail</label>
                <input id="email" name="email" type="email" class="ci-form__input" required/>
            </div>
            <div class="ci-form__field">
                <label class="ci-form__label" for="senha">Senha</label>
                <input id="senha" name="senha" type="password" class="ci-form__input" minlength="8" required/>
            </div>
            <button type="submit" class="ci-btn ci-btn--primary ci-btn--full">Criar conta</button>
        </form>
        <p class="ci-auth-card__switch">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
