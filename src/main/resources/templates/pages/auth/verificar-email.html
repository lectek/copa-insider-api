<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Verificar e-mail')}"></head>
<body class="ci-body ci-body--auth">

<div class="ci-auth-page">
    <div class="ci-auth-card">
        <div class="ci-auth-card__brand">
            <a href="/" class="ci-brand-link">
                <span class="ci-brand-badge">CI</span>
                <span class="ci-brand-name">Copa Insider</span>
            </a>
        </div>

        <h1 class="ci-auth-card__title">Confirme seu e-mail</h1>
        <p class="ci-auth-card__sub">
            Enviamos um código de 6 dígitos para
            <strong th:text="${maskedEmail}">s****o@email.com</strong>.
        </p>

        <div th:replace="~{fragments/flash :: flash}"></div>

        <div th:if="${demoCode}" class="ci-flash ci-flash--info">
            Modo dev — código: <strong th:text="${demoCode}"></strong>
        </div>

        <form th:action="@{/verificar-email}" method="post" class="ci-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="ci-form__field">
                <label class="ci-form__label" for="code">Código de verificação</label>
                <input id="code" name="code" type="text"
                       class="ci-form__input ci-otp-input"
                       placeholder="000000"
                       maxlength="6"
                       pattern="[0-9]{6}"
                       inputmode="numeric"
                       autocomplete="one-time-code"
                       required autofocus/>
            </div>

            <button type="submit" class="ci-btn ci-btn--primary ci-btn--full">Confirmar</button>
        </form>

        <div class="ci-auth-card__switch" style="display:flex;flex-direction:column;gap:.5rem;align-items:center;">
            <form th:action="@{/verificar-email/reenviar}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="ci-btn ci-btn--ghost" style="font-size:.85rem;">
                    Reenviar código
                </button>
            </form>
            <span style="font-size:.8rem;color:var(--muted);">
                ou <a th:href="@{/cadastro}">começar de novo</a>
            </span>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
