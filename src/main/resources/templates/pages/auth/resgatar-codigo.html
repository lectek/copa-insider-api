<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Resgatar Código de Acesso')}"></head>
<body class="ci-body ci-body--auth">

<div class="ci-auth-page">
    <div class="ci-auth-card" style="max-width:440px;">

        <div class="ci-auth-card__brand">
            <a href="/" class="ci-brand-link">
                <span class="ci-brand-badge">CI</span>
                <span class="ci-brand-name">Copa Insider</span>
            </a>
        </div>

        <h1 class="ci-auth-card__title">Ativar acesso</h1>
        <p class="ci-auth-card__sub">Introduz o código de 16 caracteres que recebeste após a compra.</p>

        <!-- Flash messages -->
        <div th:if="${successMessage}" class="ci-flash ci-flash--success"
             th:text="${successMessage}"></div>
        <div th:if="${infoMessage}" class="ci-flash ci-flash--info"
             th:text="${infoMessage}"></div>
        <div th:if="${errorMessage}" class="ci-flash ci-flash--error"
             th:text="${errorMessage}"></div>

        <form th:action="@{/resgatar-codigo}" method="post" class="ci-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="ci-form__field">
                <label class="ci-form__label" for="codigo">Código de acesso</label>
                <input id="codigo" name="codigo" type="text"
                       class="ci-form__input ci-form__input--code"
                       placeholder="XXXXXXXXXXXXXXXX"
                       maxlength="20"
                       autocomplete="off"
                       autocapitalize="characters"
                       required
                       oninput="this.value=this.value.toUpperCase()"/>
                <span class="ci-form__hint">
                    O código está no email de confirmação da compra.<br/>
                    Exemplo: <code>HP12AB34CD56EF78</code>
                </span>
            </div>

            <button type="submit" class="ci-btn ci-btn--primary ci-btn--full">
                Ativar acesso
            </button>
        </form>

        <div class="ci-resgate-links">
            <a th:href="@{/loja}">← Ver produtos disponíveis</a>
            <a th:href="@{/cliente/conta}">A minha conta</a>
        </div>

    </div>
</div>

<style>
.ci-form__input--code {
    text-transform: uppercase;
    letter-spacing: .14em;
    font-family: 'Courier New', monospace;
    font-size: 1rem;
    text-align: center;
}
.ci-flash--success {
    background: rgba(34,197,94,.12);
    border: 1px solid rgba(34,197,94,.3);
    color: #4ade80;
    border-radius: 8px;
    padding: .75rem 1rem;
    font-size: .88rem;
    margin-bottom: .5rem;
}
.ci-flash--info {
    background: rgba(59,130,246,.12);
    border: 1px solid rgba(59,130,246,.3);
    color: #93c5fd;
    border-radius: 8px;
    padding: .75rem 1rem;
    font-size: .88rem;
    margin-bottom: .5rem;
}
.ci-resgate-links {
    display: flex;
    justify-content: space-between;
    margin-top: 1.2rem;
    font-size: .82rem;
}
.ci-resgate-links a {
    color: #666;
    text-decoration: none;
    transition: color .15s;
}
.ci-resgate-links a:hover { color: #e8b930; }
</style>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
