<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Relatorios a Clientes</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body class="body-flex admin-page">
<header th:replace="~{fragments/admin-header :: adminHeader}"></header>
<div class="layout layout--with-sidebar">
<aside th:replace="~{fragments/admin-sidebar :: adminSidebar('relatorios')}"></aside>
  <main id="main-content" class="container stack mt-4 mb-6">
  <div class="page-header">
    <div>
      <h1 class="page-title">Relatorios</h1>
      <p class="page-lead">Visao consolidada dos clientes mais relevantes.</p>
    </div>
    <div class="page-actions">
      <a class="btn btn-ghost" th:href="@{/admin/relatorios/clientes.pdf}">Exportar PDF</a>
    </div>
  </div>

  <section th:replace="~{fragments/flash :: flash}"></section>

  <nav class="report-tabs">
    <a class="report-tab" th:href="@{/admin/relatorios/vendas}">Vendas</a>
    <a class="report-tab is-active" th:href="@{/admin/relatorios/clientes}">Clientes</a>
    <a class="report-tab" th:href="@{/admin/relatorios/produtos}">Produtos</a>
  </nav>

  <section class="stat-grid">
    <article class="stat-card">
      <span class="stat-label">Clientes no relatorio</span>
      <span class="stat-value" th:text="${clientes != null ? #lists.size(clientes) : 0}">0</span>
      <span class="stat-hint">Top clientes por compras</span>
    </article>
    <article class="stat-card">
      <span class="stat-label">Total de pedidos</span>
      <span class="stat-value" th:text="${sumQtdPedidos ?: 0}">0</span>
      <span class="stat-hint">Somatorio geral</span>
    </article>
    <article class="stat-card">
      <span class="stat-label">Faturamento</span>
      <span class="stat-value" th:text="${sumTotal != null ? #numbers.formatCurrency(sumTotal) : 'R$ 0,00'}">R$ 0,00</span>
      <span class="stat-hint">Total acumulado</span>
    </article>
  </section>

  <section class="card table-responsive">
    <table class="table">
      <thead><tr><th>Cliente</th><th>Pedidos</th><th>Total</th></tr></thead>
      <tbody>
        <tr th:each="c : ${clientes}">
          <td th:text="${c.nome}">Fulano</td>
          <td th:text="${c.qtdPedidos}">0</td>
          <td th:text="${#numbers.formatCurrency(c.valorTotal)}">R$0,00</td>
        </tr>
        <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="3" class="text-center text-muted">Sem dados.</td></tr>
      </tbody>
    </table>
  </section>
</main></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body></html>
