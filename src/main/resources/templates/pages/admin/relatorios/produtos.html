<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Relatorios a Produtos</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body class="body-flex admin-page">
<header th:replace="~{fragments/admin-header :: adminHeader}"></header>
<div class="layout layout--with-sidebar">
<aside th:replace="~{fragments/admin-sidebar :: adminSidebar('relatorios')}"></aside>
  <main id="main-content" class="container stack mt-4 mb-6">
  <div class="page-header">
    <div>
      <h1 class="page-title">Relatorios</h1>
      <p class="page-lead">Produtos que mais contribuem para o faturamento.</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost" type="button" disabled>Exportar CSV</button>
    </div>
  </div>

  <section th:replace="~{fragments/flash :: flash}"></section>

  <nav class="report-tabs">
    <a class="report-tab" th:href="@{/admin/relatorios/vendas}">Vendas</a>
    <a class="report-tab" th:href="@{/admin/relatorios/clientes}">Clientes</a>
    <a class="report-tab is-active" th:href="@{/admin/relatorios/produtos}">Produtos</a>
  </nav>

  <section class="stat-grid">
    <article class="stat-card">
      <span class="stat-label">Produtos no relatorio</span>
      <span class="stat-value" th:text="${linhas != null ? #lists.size(linhas) : 0}">0</span>
      <span class="stat-hint">Ranking por vendas</span>
    </article>
    <article class="stat-card">
      <span class="stat-label">Unidades vendidas</span>
      <span class="stat-value" th:text="${sumQtdProdutos ?: 0}">0</span>
      <span class="stat-hint">Somatorio geral</span>
    </article>
    <article class="stat-card">
      <span class="stat-label">Faturamento</span>
      <span class="stat-value" th:text="${sumTotalProdutos != null ? #numbers.formatCurrency(sumTotalProdutos) : 'R$ 0,00'}">R$ 0,00</span>
      <span class="stat-hint">Total acumulado</span>
    </article>
  </section>

  <h2 class="section-title">Produtos mais vendidos</h2>
  <section class="card table-responsive">
    <table class="table">
      <thead><tr><th>Produto</th><th>Quantidade</th><th>Faturamento</th></tr></thead>
      <tbody>
        <tr th:each="l : ${linhas}">
          <td th:text="${l.nome}">Dipirona</td>
          <td th:text="${l.qtd}">0</td>
          <td th:text="${#numbers.formatCurrency(l.total)}">R$0,00</td>
        </tr>
        <tr th:if="${#lists.isEmpty(linhas)}"><td colspan="3" class="text-center text-muted">Sem dados.</td></tr>
      </tbody>
    </table>
  </section>
</main></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body></html>
