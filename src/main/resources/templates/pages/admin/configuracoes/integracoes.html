<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Configuracoes de integracoes</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="body-flex admin-page">
<header th:replace="~{fragments/admin-header :: adminHeader}"></header>

<div class="layout layout--with-sidebar">
  <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('configuracoes')}"></aside>

  <main id="main-content" class="container stack mt-4 mb-6">
    <div class="page-header">
      <div>
        <h1 class="page-title">Integracoes</h1>
        <p class="page-lead">Chaves e endpoints para parceiros e automacoes.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" type="submit" form="integracoes-form">Salvar</button>
      </div>
    </div>

    <section th:replace="~{fragments/flash :: flash}"></section>
    <nav th:replace="~{fragments/admin-config-nav :: adminConfigNav('integracoes')}"></nav>

    <form id="integracoes-form" class="card form-grid" th:action="@{/admin/configuracoes/integracoes}" method="post" th:object="${cfg}">
      <div class="form-row">
        <div class="form-group">
          <label for="apiKey">API Key</label>
          <input id="apiKey" class="input" th:field="*{apiKey}" placeholder="Chave publica"/>
        </div>
        <div class="form-group">
          <label for="apiSecret">API Secret</label>
          <input id="apiSecret" class="input" type="password" th:field="*{apiSecret}" autocomplete="new-password" placeholder="Chave secreta"/>
        </div>
        <div class="form-group">
          <label for="webhookUrl">Webhook URL</label>
          <input id="webhookUrl" class="input" type="url" th:field="*{webhookUrl}" placeholder="https://.../webhooks/integracoes"/>
          <span class="form-hint" th:if="${webhookConfigured}">Webhook configurado.</span>
          <span class="form-hint" th:if="${!webhookConfigured}">Webhook nao configurado.</span>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" type="reset">Cancelar</button>
        <button class="btn btn-primary" type="submit">Salvar</button>
      </div>
    </form>
  </main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
