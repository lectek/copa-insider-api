<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Configuracoes de permissoes</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="body-flex admin-page">
<header th:replace="~{fragments/admin-header :: adminHeader}"></header>

<div class="layout layout--with-sidebar">
  <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('configuracoes')}"></aside>

  <main id="main-content" class="container stack mt-4 mb-6">
    <div class="page-header">
      <div>
        <h1 class="page-title">Permissoes</h1>
        <p class="page-lead">Defina quais perfis acessam cada recurso.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" type="submit" form="permissoes-form">Salvar</button>
      </div>
    </div>

    <section th:replace="~{fragments/flash :: flash}"></section>
    <nav th:replace="~{fragments/admin-config-nav :: adminConfigNav('permissoes')}"></nav>

    <form id="permissoes-form" class="card table-responsive" th:action="@{/admin/configuracoes/permissoes}" method="post" th:object="${form}">
      <table class="table" aria-label="Tabela de permissoes por perfil">
        <thead>
          <tr>
            <th>Recurso</th>
            <th>ADMIN</th>
            <th>FARMACEUTICO</th>
            <th>CAIXA</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="r, iStat : ${form.recursos}">
            <td>
              <span th:text="${r.nome}">Pedidos</span>
              <input type="hidden" th:field="*{recursos[__${iStat.index}__].id}"/>
              <input type="hidden" th:field="*{recursos[__${iStat.index}__].nome}"/>
            </td>
            <td><input type="checkbox" th:field="*{recursos[__${iStat.index}__].admin}"/></td>
            <td><input type="checkbox" th:field="*{recursos[__${iStat.index}__].farmaceutico}"/></td>
            <td><input type="checkbox" th:field="*{recursos[__${iStat.index}__].caixa}"/></td>
          </tr>
        </tbody>
      </table>
      <div class="form-actions">
        <button class="btn btn-ghost" type="reset">Cancelar</button>
        <button class="btn btn-primary" type="submit">Salvar</button>
      </div>
    </form>
  </main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
