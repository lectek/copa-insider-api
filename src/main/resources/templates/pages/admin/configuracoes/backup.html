<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Configuracoes de backup</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="body-flex admin-page">
<header th:replace="~{fragments/admin-header :: adminHeader}"></header>

<div class="layout layout--with-sidebar">
  <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('configuracoes')}"></aside>

  <main id="main-content" class="container stack mt-4 mb-6">
    <div class="page-header">
      <div>
        <h1 class="page-title">Backup e restauracao</h1>
        <p class="page-lead">Controle backups do banco e arquivos da aplicacao.</p>
      </div>
    </div>

    <section th:replace="~{fragments/flash :: flash}"></section>
    <nav th:replace="~{fragments/admin-config-nav :: adminConfigNav('backup')}"></nav>

    <section class="card">
      <h2 class="card-title">Backup agora</h2>
      <p class="form-hint">Esse recurso precisa de configuracao no servidor.</p>
      <form th:action="@{/admin/configuracoes/backup/now}" method="post">
        <button class="btn btn-primary">Gerar backup</button>
      </form>
    </section>

    <section class="card mt-4 table-responsive">
      <div class="between mb-12">
        <div>
          <h2 class="section-title">Historico</h2>
          <p class="section-subtitle">Arquivos gerados localmente.</p>
        </div>
      </div>
      <table class="table" aria-label="Historico de backups">
        <thead>
          <tr>
            <th>Arquivo</th>
            <th>Data</th>
            <th>Acoes</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="b : ${backups}">
            <td th:text="${b.nome}">backup-2025-01-01.zip</td>
            <td th:text="${#dates.format(b.data,'dd/MM/yyyy HH:mm')}">01/01/2025 10:00</td>
            <td class="actions">
              <a class="btn btn-ghost" th:href="@{|/admin/configuracoes/backup/download/${b.nome}|}">Baixar</a>
              <form th:action="@{|/admin/configuracoes/backup/restore/${b.nome}|}" method="post" class="inline">
                <button class="btn btn-ghost">Restaurar</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(backups)}">
            <td colspan="3" class="text-center text-muted">Nenhum backup encontrado.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
