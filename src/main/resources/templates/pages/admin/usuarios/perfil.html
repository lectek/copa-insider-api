<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Perfil do Usuario</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body class="body-flex admin-page">
<header th:replace="~{fragments/admin-header :: adminHeader}"></header>
<div class="layout layout--with-sidebar">
<aside th:replace="~{fragments/admin-sidebar :: adminSidebar('usuarios')}"></aside>
<main id="main-content" class="container stack mt-4 mb-6">
  <h1 class="page-title">Perfil</h1>
  <section class="grid grid-cols-1 md:grid-cols-3 gap-16">
    <article class="card">
      <h2 class="card-title">Dados</h2>
      <p><strong>Nome:</strong> <span th:text="${u.nome}">Fulano</span></p>
      <p><strong>E-mail:</strong> <span th:text="${u.email}">a@b.com</span></p>
      <p><strong>Papel:</strong> <span th:text="${u.papel}">ADMIN</span></p>
      <p><strong>Status:</strong> <span th:text="${u.ativo} ? 'Ativo' : 'Inativo'">Ativo</span></p>
      <a class="btn mt-2" th:href="@{|/admin/usuarios/${u.id}/editar|}">Editar</a>
    </article>
    <article class="card md:col-span-2">
      <h2 class="card-title">Atividades recentes</h2>
      <ul class="list" th:each="log : ${logs}">
        <li><span th:text="${#dates.format(log.data,'dd/MM/yyyy HH:mm')}">a</span> a <span th:text="${log.acao}">Login</span></li>
      </ul>
      <p th:if="${#lists.isEmpty(logs)}" class="text-muted">Sem registros.</p>
    </article>
  </section>
</main></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body></html>
