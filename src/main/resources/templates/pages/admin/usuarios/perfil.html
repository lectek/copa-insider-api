<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Perfil do Utilizador')}"></head>
<body class="ci-body ci-admin">

<div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

<div class="ci-admin-main">
    <div th:replace="~{fragments/admin-header :: header('Perfil do Utilizador')}"></div>
    <div th:replace="~{fragments/flash :: flash}"></div>

    <main class="ci-admin-content">

        <div style="margin-bottom:1.2rem">
            <a th:href="@{/admin/usuarios}" class="ci-btn ci-btn--ghost ci-btn--sm">← Utilizadores</a>
        </div>

        <div class="ci-card" style="max-width:520px">
            <div style="display:flex;flex-direction:column;gap:.9rem">

                <div style="display:flex;align-items:center;gap:1rem;padding-bottom:1rem;border-bottom:1px solid #1e293b">
                    <div style="width:52px;height:52px;border-radius:50%;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#94a3b8">
                        👤
                    </div>
                    <div>
                        <div style="font-weight:700;font-size:1.05rem;color:#fff"
                             th:text="${u.nome() ?: '—'}">Nome</div>
                        <div style="font-size:.85rem;color:#94a3b8" th:text="${u.email()}">email</div>
                    </div>
                </div>

                <div class="ci-stats-grid">
                    <div class="ci-stat-card">
                        <p class="ci-stat-card__label">Papel</p>
                        <p class="ci-stat-card__value" style="font-size:1rem"
                           th:text="${u.papel() ?: 'Utilizador'}">Utilizador</p>
                    </div>
                    <div class="ci-stat-card">
                        <p class="ci-stat-card__label">Estado</p>
                        <p class="ci-stat-card__value" style="font-size:1rem"
                           th:text="${u.ativo() ? 'Ativo' : 'Inativo'}">Ativo</p>
                    </div>
                </div>

                <div th:if="${u.ultimoAcesso() != null}"
                     style="font-size:.82rem;color:#64748b">
                    Último acesso: <span th:text="${#temporals.format(u.ultimoAcesso(), 'dd/MM/yyyy HH:mm')}"></span>
                </div>

                <div style="display:flex;gap:.5rem;margin-top:.5rem">
                    <a th:href="@{/admin/usuarios/{id}/editar(id=${u.id()})}"
                       class="ci-btn ci-btn--primary ci-btn--sm">Editar</a>
                </div>

            </div>
        </div>

    </main>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
