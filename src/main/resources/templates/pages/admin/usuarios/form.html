<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Usuario - Form</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body class="body-flex admin-page">
<header th:replace="~{fragments/admin-header :: adminHeader}"></header>
<div class="layout layout--with-sidebar">
<aside th:replace="~{fragments/admin-sidebar :: adminSidebar('usuarios')}"></aside>
<main id="main-content" class="container stack mt-4 mb-6">
  <h1 class="page-title" th:text="${#ids.prev('id') != null} ? 'Editar Usuario' : 'Novo Usuario'">Usuario</h1>
  <form class="form-grid" th:action="@{/admin/usuarios}" method="post" th:object="${usuario}">
    <input type="hidden"
           th:if="${_csrf != null}"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>
    <div class="form-group"><label>Nome</label><input class="input" th:field="*{nome}" required/></div>
    <div class="form-group"><label>E-mail</label><input class="input" type="email" th:field="*{email}" required/></div>
    <div class="form-group"><label>CPF</label><input class="input" th:field="*{cpf}"/></div>
    <div class="form-group"><label>Papel</label>
      <select class="select" th:field="*{papel}">
        <option>ADMIN</option><option>FARMACEUTICO</option><option>CAIXA</option><option>CLIENTE_VIP</option>
      </select>
    </div>
    <label class="checkbox"><input type="checkbox" th:field="*{ativo}"/> Ativo</label>
    <div class="form-actions"><button class="btn btn-primary">Salvar</button></div>
  </form>
</main></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body></html>
