<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body class="ci-body ci-admin">

<div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

<div class="ci-admin-main">
    <div th:replace="~{fragments/admin-header :: header('Dashboard')}"></div>
    <div th:replace="~{fragments/flash :: flash}"></div>

    <main class="ci-admin-content">

        <!-- Métricas Copa -->
        <div class="ci-stats-grid">
            <div class="ci-stat-card">
                <p class="ci-stat-card__label">Utilizadores registados</p>
                <p class="ci-stat-card__value" th:text="${totalUsuarios ?: 0}">0</p>
            </div>
            <div class="ci-stat-card">
                <p class="ci-stat-card__label">Produtos ativos</p>
                <p class="ci-stat-card__value" th:text="${totalProdutos ?: 0}">0</p>
            </div>
            <div class="ci-stat-card">
                <p class="ci-stat-card__label">Compras Hotmart</p>
                <p class="ci-stat-card__value" th:text="${totalCompras ?: 0}">0</p>
            </div>
            <div class="ci-stat-card">
                <p class="ci-stat-card__label">Acessos concedidos</p>
                <p class="ci-stat-card__value" th:text="${totalAcessos ?: 0}">0</p>
            </div>
        </div>

        <!-- Utilizadores recentes -->
        <section class="ci-admin-section">
            <div class="ci-admin-section__header">
                <h2 class="ci-admin-section__title">Utilizadores recentes</h2>
                <a th:href="@{/admin/usuarios}" class="ci-btn ci-btn--ghost ci-btn--sm">Ver todos</a>
            </div>
            <table class="ci-table" th:if="${usuariosRecentes != null and !usuariosRecentes.empty}">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Registado em</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuariosRecentes}">
                        <td th:text="${u.nome()}">Nome</td>
                        <td th:text="${u.email()}">email@exemplo.com</td>
                        <td th:text="${u.criadoEm() != null ? #temporals.format(u.criadoEm(), 'dd/MM/yyyy') : '—'}">01/06/2026</td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${usuariosRecentes == null or usuariosRecentes.empty}" class="ci-empty">
                Nenhum utilizador registado ainda.
            </p>
        </section>

    </main>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
