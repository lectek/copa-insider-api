<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Acessos Copa')}"></head>
<body class="ci-body ci-admin">

<div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

<div class="ci-admin-main">
    <div th:replace="~{fragments/admin-header :: header('Acessos Copa 2026')}"></div>
    <div th:replace="~{fragments/flash :: flash}"></div>

    <main class="ci-admin-content">

        <!-- Conceder acesso manual -->
        <section class="ci-admin-section" style="border:1px solid rgba(245,166,35,.25);background:rgba(245,166,35,.04);border-radius:10px;padding:1.25rem 1.5rem;margin-bottom:1.75rem">
            <h2 class="ci-admin-section__title" style="margin-bottom:1rem">Conceder acesso manual</h2>
            <form th:action="@{/admin/copa/acessos/conceder}" method="post"
                  style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div style="display:flex;flex-direction:column;gap:.3rem;flex:1;min-width:220px">
                    <label for="conceder-email" style="font-size:.78rem;color:#94a3b8;font-weight:600">E-mail do utilizador</label>
                    <input id="conceder-email" type="email" name="email" required placeholder="utilizador@email.com"
                           style="padding:.5rem .75rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:.9rem"/>
                </div>
                <div style="display:flex;flex-direction:column;gap:.3rem;flex:1;min-width:200px">
                    <label for="conceder-slug" style="font-size:.78rem;color:#94a3b8;font-weight:600">Produto</label>
                    <select id="conceder-slug" name="slug" required
                            style="padding:.5rem .75rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:.9rem">
                        <option value="">Seleccionar produto…</option>
                        <option th:each="p : ${produtos}"
                                th:value="${p.slug}"
                                th:text="${(p.nomePtPt != null and !p.nomePtPt.isBlank()) ? p.nomePtPt : p.slug}
                                          + (p.slug == 'copa-pass' ? ' ⭐ (inclui tudo)' : '')">
                        </option>
                    </select>
                </div>
                <button type="submit" class="ci-btn ci-btn--primary ci-btn--sm">Conceder acesso</button>
            </form>
        </section>

        <!-- Filtro por email -->
        <form th:action="@{/admin/copa/acessos}" method="get"
              style="display:flex;gap:.5rem;margin-bottom:1.5rem;align-items:center">
            <input type="text" name="email" th:value="${emailFiltro}"
                   placeholder="Pesquisar por e-mail…"
                   style="flex:1;max-width:360px;padding:.5rem .75rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:.9rem"/>
            <button type="submit" class="ci-btn ci-btn--primary ci-btn--sm">Pesquisar</button>
            <a th:if="${emailFiltro != ''}" th:href="@{/admin/copa/acessos}" class="ci-btn ci-btn--ghost ci-btn--sm">Limpar</a>
        </form>

        <div class="ci-stats-grid" style="margin-bottom:1.5rem">
            <div class="ci-stat-card">
                <p class="ci-stat-card__label">Total de acessos</p>
                <p class="ci-stat-card__value" th:text="${pagina.totalElements}">0</p>
            </div>
        </div>

        <table class="ci-table" th:if="${acessos != null and !acessos.empty}">
            <thead>
                <tr>
                    <th>E-mail</th>
                    <th>Produto (slug)</th>
                    <th>Transação</th>
                    <th>Concedido em</th>
                    <th>Origem</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="a : ${acessos}">
                    <td th:text="${a.email}">email</td>
                    <td><code th:text="${a.produtoSlug}">slug</code></td>
                    <td><code th:text="${a.transacao ?: '—'}">txn</code></td>
                    <td th:text="${#temporals.format(a.concedidoEm, 'dd/MM/yyyy HH:mm')}">data</td>
                    <td>
                        <span class="ci-badge"
                              th:classappend="${a.transacao == 'MANUAL-ADMIN'} ? 'ci-badge--gray' : 'ci-badge--green'"
                              th:text="${a.transacao == 'MANUAL-ADMIN'} ? 'Manual' : 'Hotmart'">Hotmart</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/copa/acessos/{id}/revogar(id=${a.id})}" method="post"
                              onsubmit="return confirm('Revogar acesso de ' + this.dataset.email + '?')"
                              th:data-email="${a.email}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="email" th:value="${emailFiltro}"/>
                            <button type="submit" class="ci-btn ci-btn--ghost ci-btn--xs"
                                    style="color:#ef4444;border-color:#ef4444">Revogar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <p th:if="${acessos == null or acessos.empty}" class="ci-empty">
            <span th:if="${emailFiltro != ''}">Nenhum acesso encontrado para "<span th:text="${emailFiltro}"></span>".</span>
            <span th:if="${emailFiltro == ''}">Nenhum acesso concedido ainda.</span>
        </p>

        <!-- Paginação -->
        <div th:if="${pagina.totalPages > 1}" style="display:flex;gap:.5rem;margin-top:1.5rem;flex-wrap:wrap">
            <a th:if="${paginaAtual > 0}"
               th:href="@{/admin/copa/acessos(page=${paginaAtual - 1}, email=${emailFiltro})}"
               class="ci-btn ci-btn--ghost ci-btn--sm">← Anterior</a>
            <span th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}">
                <a th:href="@{/admin/copa/acessos(page=${i}, email=${emailFiltro})}"
                   class="ci-btn ci-btn--sm"
                   th:classappend="${i == paginaAtual} ? 'ci-btn--primary' : 'ci-btn--ghost'"
                   th:text="${i + 1}">1</a>
            </span>
            <a th:if="${paginaAtual < pagina.totalPages - 1}"
               th:href="@{/admin/copa/acessos(page=${paginaAtual + 1}, email=${emailFiltro})}"
               class="ci-btn ci-btn--ghost ci-btn--sm">Próxima →</a>
        </div>

    </main>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
