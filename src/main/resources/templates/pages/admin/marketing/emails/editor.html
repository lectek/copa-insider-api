<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Editor de template</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="body-flex admin-page">
<header th:replace="~{fragments/admin-header :: adminHeader}"></header>

<div class="layout layout--with-sidebar">
  <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('marketing')}"></aside>
  <main id="main-content" class="container stack mt-4 mb-6">
    <div class="page-header">
      <div>
        <h1 class="page-title">Editor de template</h1>
        <p class="page-lead">Crie o HTML e assunto do email.</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-ghost" th:href="@{/admin/marketing/emails/templates}">Voltar</a>
        <button class="btn btn-primary" type="submit" form="template-form">Salvar</button>
      </div>
    </div>

    <section th:replace="~{fragments/flash :: flash}"></section>

    <form id="template-form" class="form-grid card" th:action="@{/admin/marketing/emails/editor}" method="post" th:object="${template}">
      <input type="hidden" th:field="*{id}"/>
      <div class="form-row">
        <div class="form-group">
          <label for="nome">Nome</label>
          <input id="nome" class="input" th:field="*{nome}" required/>
        </div>
        <div class="form-group">
          <label for="assunto">Assunto</label>
          <input id="assunto" class="input" th:field="*{assunto}" required/>
        </div>
      </div>
      <div class="form-group">
        <label for="html">HTML do email</label>
        <textarea id="html" class="input" rows="16" th:field="*{html}" placeholder="<!DOCTYPE html>..."></textarea>
      </div>

      <fieldset class="fieldset">
        <legend>Teste</legend>
        <div class="form-row">
          <input class="input" type="email" name="testeDestino" placeholder="destinatario@exemplo.com"/>
          <button class="btn" name="acao" value="teste">Enviar teste</button>
        </div>
      </fieldset>

      <div class="form-actions">
        <button class="btn btn-ghost" type="reset">Cancelar</button>
        <button class="btn btn-primary" type="submit">Salvar</button>
      </div>
    </form>
  </main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
