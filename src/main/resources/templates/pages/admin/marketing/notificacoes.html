<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Marketing a Notificacoes</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body class="body-flex admin-page">
<header th:replace="~{fragments/admin-header :: adminHeader}"></header>
<div class="layout layout--with-sidebar">
<aside th:replace="~{fragments/admin-sidebar :: adminSidebar('marketing')}"></aside>
<main id="main-content" class="container stack mt-4 mb-6">
  <h1 class="page-title">Notificacoes</h1>
  <form class="card form-grid" th:action="@{/admin/marketing/notificacoes}" method="post" th:object="${notif}">
    <div class="form-row">
      <select class="select" th:field="*{canal}">
        <option>APP</option><option>WhaTSAPP</option><option>EMAIL</option><option>SMS</option>
      </select>
      <input class="input" th:field="*{titulo}" placeholder="TAtulo"/>
    </div>
    <div class="form-group"><textarea class="input" th:field="*{mensagem}" rows="4" placeholder="Mensagema"></textarea></div>
    <div class="form-actions"><button class="btn btn-primary">Disparar</button></div>
  </form>
</main></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body></html>
