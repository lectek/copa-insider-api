<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title th:text="${pageTitle}">Financeiro a Assinaturas</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="body-flex admin-page">
<header th:replace="~{fragments/admin-header :: adminHeader}"></header>

<div class="layout layout--with-sidebar">
  <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('financeiro')}"></aside>

  <main id="main-content" class="container stack mt-4 mb-6">

    <div class="row between center mb-3">
      <h1 class="page-title">Assinaturas</h1>

      <!-- Busca -->
      <form class="form-inline" th:action="@{/admin/financeiro/assinaturas}" method="get">
        <input class="input" type="search" name="q" placeholder="Buscar cliente/plano"
               th:value="${param.q}" />
        <!-- preserve Paginacao quando filtrar -->
        <input type="hidden" name="size" th:value="${param.size}"/>
        <button class="btn" type="submit">Buscar</button>
        <a class="btn btn-ghost" th:href="@{/admin/financeiro/assinaturas}">Limpar</a>
      </form>
    </div>

    <section class="card table-responsive"
             th:with="badgeClass(s)= ${s}=='ATIVA' ? 'badge-success' : (${s}=='atrasADA' ? 'badge-danger' : 'badge-warning')">

      <table class="table">
        <thead>
          <tr>
            <th>
              <a th:href="@{|/admin/financeiro/assinaturas?${#strings.arrayJoin(new String[]{'q='+(param.q?:''),'sort=clienteNome,'+(${param.sort}?:'').contains('clienteNome,asc')?'desc':'asc','size='+(param.size?:'')} ,'&') }|}">
                Cliente
              </a>
            </th>
            <th>
              <a th:href="@{|/admin/financeiro/assinaturas?${#strings.arrayJoin(new String[]{'q='+(param.q?:''),'sort=plano,'+(${param.sort}?:'').contains('plano,asc')?'desc':'asc','size='+(param.size?:'')} ,'&') }|}">
                Plano
              </a>
            </th>
            <th>Valor</th>
            <th>
              <a th:href="@{|/admin/financeiro/assinaturas?${#strings.arrayJoin(new String[]{'q='+(param.q?:''),'sort=renovaEm,'+(${param.sort}?:'').contains('renovaEm,asc')?'desc':'asc','size='+(param.size?:'')} ,'&') }|}">
                Renova em
              </a>
            </th>
            <th>Status</th>
            <th class="text-right">Acoes</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="a : ${assinaturas}">
            <td th:text="${a.clienteNome}">Fulano</td>
            <td th:text="${a.plano}">Plano VIP</td>
            <td th:text="${#numbers.formatCurrency(a.valor)}">R$ 0,00</td>
            <td th:text="${#temporals.format(a.renovaEm,'dd/MM/yyyy')}">01/01/2026</td>
            <td>
              <span class="badge" th:text="${a.status}" th:classappend="${' ' + badgeClass(a.status)}">ATIVA</span>
            </td>
            <td class="text-right">
              <a class="btn btn-ghost" th:href="@{|/admin/financeiro/assinaturas/${a.id}|}">Detalhes</a>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(assinaturas)}">
            <td colspan="6" class="text-center text-muted">Sem assinaturas.</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Paginacao: aparece se existir atributo 'page' (Spring Data Page) -->
    <nav class="Pagination" th:if="${page != null}">
      <a class="btn" th:classappend="${page.first} ? ' disabled'"
         th:href="@{|/admin/financeiro/assinaturas?page=${page.number-1}&size=${page.size}&q=${param.q}&sort=${param.sort}|}">Anterior</a>

      <span>Pagina <strong th:text="${page.number + 1}">1</strong> de <strong th:text="${page.totalPages}">1</strong></span>

      <a class="btn" th:classappend="${page.last} ? ' disabled'"
         th:href="@{|/admin/financeiro/assinaturas?page=${page.number+1}&size=${page.size}&q=${param.q}&sort=${param.sort}|}">Proxima</a>
    </nav>

  </main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
