<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Agendamentos de Medicacao</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body class="body-flex admin-page">
<header th:replace="~{fragments/admin-header :: adminHeader}"></header>
<div class="layout layout--with-sidebar">
<aside th:replace="~{fragments/admin-sidebar :: adminSidebar('agendamentos')}"></aside>
<main id="main-content" class="container stack mt-4 mb-6">
  <h1 class="page-title">Agendamentos de Medicacao</h1>
  <form class="form-grid card mb-4" th:action="@{/admin/agendamentos/medicacao}" method="post" th:object="${novo}">
    <div class="form-group"><label>Cliente</label><input class="input" th:field="*{clienteEmail}" placeholder="email@cliente.com" required/></div>
    <div class="form-group"><label>Medicamento</label><input class="input" th:field="*{medicamento}" required/></div>
    <div class="form-row">
      <div class="form-group"><label>Frequencia</label>
        <select class="select" th:field="*{frequencia}">
          <option value="Diario">Diario</option><option value="SEMANAL">Semanal</option>
        </select>
      </div>
      <div class="form-group"><label>Horario</label><input class="input" type="time" th:field="*{Horario}" required/></div>
      <div class="form-group"><label>Canal</label>
        <select class="select" th:field="*{canal}">
          <option>APP</option><option>WhaTSAPP</option><option>EMAIL</option>
        </select>
      </div>
    </div>
    <div class="form-actions"><button class="btn btn-primary">Agendar</button></div>
  </form>

  <section class="card table-responsive">
    <h2 class="card-title">Agendamentos ativos</h2>
    <table class="table">
      <thead><tr><th>Cliente</th><th>Medicamento</th><th>Freq.</th><th>Horario</th><th>Canal</th><th>Acoes</th></tr></thead>
      <tbody>
        <tr th:each="a : ${agendamentos}">
          <td th:text="${a.clienteEmail}">email@c.com</td>
          <td th:text="${a.medicamento}">Dipirona</td>
          <td th:text="${a.frequencia}">Diario</td>
          <td th:text="${a.Horario}">08:00</td>
          <td th:text="${a.canal}">APP</td>
          <td class="actions">
            <a class="btn btn-ghost" th:href="@{|/admin/agendamentos/${a.id}/editar|}">Editar</a>
            <form th:action="@{|/admin/agendamentos/${a.id}/remover|}" method="post" class="inline"><button class="btn btn-ghost">Remover</button></form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(agendamentos)}"><td colspan="6" class="text-center text-muted">Sem agendamentos.</td></tr>
      </tbody>
    </table>
  </section>
</main></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body></html>
