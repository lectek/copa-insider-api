<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Catalogo - Produtos</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>

  <!-- CSRF (para chamadas JS autenticadas, se necessario) -->
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

  <style>
    #toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:9999}
    .toast{background:#0f1320;color:#e9eef6;border:1px solid rgba(255,255,255,.07);
           border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .toast.ok{border-color:rgba(46,204,113,.5)}
    .toast.err{border-color:rgba(231,76,60,.5)}
    .card-prod{display:flex;flex-direction:column;gap:.5rem}
    .card-prod .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:#111}
    .price{font-weight:600}
    .muted{opacity:.7}
  </style>
</head>
<body class="body-flex admin-page">
<header th:replace="~{fragments/admin-header :: adminHeader}"></header>

<div class="layout layout--with-sidebar">
  <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('produtos')}"></aside>

<main class="container stack mt-4 mb-8" id="main-content">
    <div class="between mb-4">
      <h1 class="page-title">Catalogo</h1>

      <!-- Filtro rapido -->
      <form class="form-row gap-2" id="form-busca">
        <input class="input" id="q" name="q" placeholder="Buscar por nome ou EAN"/>
        <button class="btn" type="submit">Buscar</button>
        <button class="btn btn-ghost" type="button" id="btn-limpar">Limpar</button>
      </form>
    </div>

    <!-- Info do contexto (admin/cliente) -->
    <div class="alert info mb-3" th:if="${isAdmin}">Modo administrador: voce pode editar produtos.</div>

    <!-- Grid de cards -->
    <section id="catalogo-grid" class="grid grid-4 gap-4" aria-live="polite"></section>

    <!-- Paginacao simples -->
    <div class="center mt-6">
      <button class="btn btn-ghost" id="btn-prev" disabled>Anterior</button>
      <span id="paginacao-info" class="mx-3 text-muted">Pagina 1</span>
      <button class="btn" id="btn-next" disabled>Proxima</button>
    </div>
  </main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<div id="toast"></div>

<!-- Thymeleaf injeta o contexto para o JS -->
<script th:inline="javascript">
  window.CATALOGO_CTX = {
    isAdmin: /*[[${isAdmin}]]*/ false
  };
</script>

<script th:src="@{/js/ui.js}"></script>
<script th:src="@{/js/pages/catalogo.js}"></script>
</body>
</html>
