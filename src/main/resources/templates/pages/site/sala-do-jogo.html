<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- SEO primário -->
    <title th:text="${partida.selecaoCasa()} + ' × ' + ${partida.selecaoVisitante()} + ' ao Vivo — Assista Grátis, Sem Anúncios | Copa Insider'">Copa 2026 ao Vivo | Copa Insider</title>
    <meta name="description"
          th:content="'Assista agora à Copa do Mundo 2026 ao vivo — gratuito e sem anúncios. Acompanha ' + ${partida.selecaoCasa()} + ' × ' + ${partida.selecaoVisitante()} + ' com chat em tempo real, reações e notas dos jogadores. Sem registo obrigatório.'"/>
    <meta name="robots" content="index, follow"/>
    <link rel="canonical" th:href="${baseUrl + '/jogo/' + partida.id() + '/sala'}"/>

    <!-- Open Graph -->
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="Copa Insider"/>
    <meta property="og:title"
          th:content="${partida.selecaoCasa()} + ' × ' + ${partida.selecaoVisitante()} + ' ao Vivo — Grátis, Sem Anúncios | Copa Insider'"/>
    <meta property="og:description"
          th:content="'Acompanha ' + ${partida.selecaoCasa()} + ' × ' + ${partida.selecaoVisitante()} + ' da Copa 2026 ao vivo. Chat em tempo real, reações e notas dos jogadores. Gratuito e sem anúncios.'"/>
    <meta property="og:url" th:content="${baseUrl + '/jogo/' + partida.id() + '/sala'}"/>
    <meta property="og:image" th:content="${baseUrl + '/img/og-copa.webp'}"/>
    <meta property="og:locale" content="pt_BR"/>

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title"
          th:content="${partida.selecaoCasa()} + ' × ' + ${partida.selecaoVisitante()} + ' ao Vivo | Copa Insider'"/>
    <meta name="twitter:description"
          th:content="'Chat ao vivo, reações e notas dos jogadores. Copa do Mundo 2026. Gratuito e sem anúncios.'"/>
    <meta name="twitter:image" th:content="${baseUrl + '/img/og-copa.webp'}"/>

    <!-- Schema.org SportsEvent -->
    <script type="application/ld+json" th:inline="text">
    {
      "@context": "https://schema.org",
      "@type": "SportsEvent",
      "name": "[[${partida.selecaoCasa()}]] × [[${partida.selecaoVisitante()}]] — Copa do Mundo 2026",
      "description": "Acompanha ao vivo com chat em tempo real, reações e notas dos jogadores. Gratuito e sem anúncios.",
      "startDate": "[[${#temporals.format(partida.dataHora(), 'yyyy-MM-dd\'T\'HH:mm:ss')}]]",
      "location": { "@type": "Place", "name": "[[${partida.estadio()}]]", "address": "[[${partida.cidade()}]]" },
      "sport": "Futebol",
      "url": "[[${baseUrl}]]/jogo/[[${partida.id()}]]/sala",
      "isAccessibleForFree": true,
      "organizer": { "@type": "Organization", "name": "FIFA", "url": "https://www.fifa.com" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/partida.css}"/>
    <style>
        :root{--bg:#0a0a0a;--surface:#141414;--card:#161616;--gold:#e8b930;--border:#2a2a2a;--text:#fff;--muted:#8a8a8a;}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{
            background:
                linear-gradient(rgba(10,10,10,.82) 0%, rgba(10,10,10,.88) 100%),
                url('/img/tv-banner-bg.jpg') center 40% / cover fixed no-repeat;
            color:var(--text);font-family:'Inter',sans-serif;
        }

        .sala-layout{display:grid;grid-template-columns:1fr 380px;gap:0;min-height:calc(100vh - 130px);}
        @media(max-width:900px){.sala-layout{grid-template-columns:1fr;}}

        /* Score bar */
        .score-bar{background:var(--surface);border-bottom:1px solid var(--border);
            padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
        .score-bar__teams{display:flex;align-items:center;gap:16px;font-size:20px;font-weight:800;}
        .score-bar__score{font-size:28px;font-weight:900;color:var(--gold);padding:0 12px;}
        .score-bar__status{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
            padding:4px 10px;border-radius:20px;background:#1a1a1a;color:var(--muted);}
        .score-bar__status.live{background:#1a0a0a;color:#ef4444;animation:pulse 1.5s infinite;}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
        .score-bar__links{display:flex;gap:8px;flex-wrap:wrap;}
        .link-btn{font-size:12px;font-weight:700;padding:6px 14px;border-radius:8px;
            background:rgba(255,255,255,.06);color:var(--text);text-decoration:none;border:1px solid var(--border);
            transition:background .2s;}
        .link-btn:hover{background:rgba(232,185,48,.15);border-color:var(--gold);}
        .link-btn.gold{background:rgba(232,185,48,.15);border-color:rgba(232,185,48,.4);color:var(--gold);}

        /* Main area */
        .sala-main{padding:24px;display:flex;flex-direction:column;gap:20px;}

        /* Notas panel */
        .notas-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;}
        .notas-panel__header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
        .notas-panel__title{font-size:14px;font-weight:700;color:var(--text);}
        .notas-tabs{display:flex;gap:6px;}
        .notas-tab{font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;border:1px solid var(--border);
            background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;}
        .notas-tab.active{background:rgba(232,185,48,.1);border-color:rgba(232,185,48,.4);color:var(--gold);}

        .notas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
        .nota-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;
            display:flex;flex-direction:column;gap:8px;transition:border-color .2s;}
        .nota-card:hover{border-color:rgba(232,185,48,.3);}
        .nota-card__pos{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
            color:var(--muted);}
        .nota-card__nome{font-size:13px;font-weight:700;color:var(--text);line-height:1.2;}
        .nota-card__media{font-size:24px;font-weight:900;color:var(--gold);line-height:1;}
        .nota-card__media.hidden{color:var(--muted);font-size:18px;}
        .nota-card__votos{font-size:11px;color:var(--muted);}
        .nota-card__stars{display:flex;gap:3px;flex-wrap:wrap;}
        .star{width:22px;height:22px;border-radius:4px;border:1px solid var(--border);background:rgba(255,255,255,.04);
            font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;
            justify-content:center;transition:all .15s;}
        .star:hover,.star.sel{background:rgba(232,185,48,.2);border-color:rgba(232,185,48,.5);color:var(--gold);}
        .star.voted{background:rgba(232,185,48,.15);border-color:rgba(232,185,48,.4);color:var(--gold);}

        /* Chat sidebar */
        .chat-sidebar{border-left:1px solid var(--border);display:flex;flex-direction:column;height:calc(100vh - 130px);
            position:sticky;top:0;}
        @media(max-width:900px){.chat-sidebar{height:420px;border-left:none;border-top:1px solid var(--border);}}
        .chat-header{padding:16px 20px;border-bottom:1px solid var(--border);
            display:flex;align-items:center;justify-content:space-between;}
        .chat-header h3{font-size:14px;font-weight:700;}
        .chat-online{font-size:11px;color:var(--muted);}

        .reactions-bar{padding:10px 16px;border-bottom:1px solid var(--border);
            display:flex;gap:6px;flex-wrap:wrap;}
        .react-btn{font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px;border:1px solid var(--border);
            background:transparent;transition:background .15s;}
        .react-btn:hover{background:rgba(255,255,255,.08);}
        .react-fly{position:fixed;font-size:28px;pointer-events:none;animation:fly 1.5s ease-out forwards;z-index:999;}
        @keyframes fly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-120px) scale(1.8)}}

        .chat-messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;
            scroll-behavior:smooth;}
        .msg{font-size:13px;line-height:1.4;}
        .msg__nome{font-weight:700;color:var(--gold);margin-right:4px;}
        .msg__hora{font-size:10px;color:var(--muted);margin-left:6px;}

        .chat-form{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
        .chat-nome-row{display:flex;gap:8px;}
        .chat-input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;
            padding:8px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s;}
        .chat-input:focus{border-color:rgba(232,185,48,.4);}
        .chat-msg-row{display:flex;gap:8px;}
        .chat-send{background:var(--gold);color:#0a0a0a;border:none;border-radius:8px;
            padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;}
        .chat-send:hover{opacity:.9;}

        .segunda-tela-link{
            display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
            color:var(--muted);text-decoration:none;padding:6px 12px;border:1px solid var(--border);
            border-radius:8px;transition:all .2s;
        }
        .segunda-tela-link:hover{color:var(--gold);border-color:rgba(232,185,48,.4);}
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="brand"><img src="/img/logo-sm.webp" alt="Copa Insider" style="width:32px;height:32px;object-fit:contain;"/> Copa Insider</a>
    <div class="nav-links">
        <a th:href="@{/calendario}">Calendário</a>
        <a th:href="@{/selecoes}">Seleções</a>
        <a th:href="@{/ranking}">Ranking</a>
    </div>
    <a th:href="@{/segunda-tela/{id}(id=${partida.id()})}" class="segunda-tela-link">📱 Segunda Tela</a>
</nav>

<!-- Score bar -->
<div class="score-bar">
    <div class="score-bar__teams">
        <span th:text="${partida.bandeiraCasa()}"></span>
        <span th:text="${partida.selecaoCasa()}"></span>
        <span class="score-bar__score" th:if="${partida.temResultado()}"
              th:text="${partida.golsCasa()} + ' : ' + ${partida.golsVisitante()}">0 : 0</span>
        <span class="score-bar__score" th:unless="${partida.temResultado()}">-</span>
        <span th:text="${partida.selecaoVisitante()}"></span>
        <span th:text="${partida.bandeiraVisitante()}"></span>
    </div>
    <span class="score-bar__status"
          th:classappend="${partida.aoVivo()} ? ' live' : ''"
          th:text="${partida.aoVivo()} ? '🔴 AO VIVO' : (${partida.encerrada()} ? 'Encerrado' : 'Agendado')">
    </span>
    <div class="score-bar__links">
        <a href="https://www.youtube.com/@CBF" target="_blank" rel="noopener" class="link-btn">📺 YouTube CBF</a>
        <a href="https://www.youtube.com/@fpf_portugal" target="_blank" rel="noopener" class="link-btn">📺 FPF</a>
        <a href="https://www.youtube.com/@fifacom" target="_blank" rel="noopener" class="link-btn gold">🌐 FIFA+</a>
        <a th:href="@{/jogo/{id}/notas(id=${partida.id()})}" class="link-btn">⭐ Notas ao Vivo</a>
    </div>
</div>

<div class="sala-layout">

    <!-- Main: notas panel -->
    <div class="sala-main">

        <div class="notas-panel">
            <div class="notas-panel__header">
                <span class="notas-panel__title">⭐ Notas dos Jogadores</span>
                <div class="notas-tabs">
                    <button class="notas-tab active" id="tab-casa"
                            th:text="${partida.bandeiraCasa()} + ' ' + ${partida.selecaoCasa()}"
                            onclick="switchNotas('casa')">Casa</button>
                    <button class="notas-tab" id="tab-visitante"
                            th:text="${partida.bandeiraVisitante()} + ' ' + ${partida.selecaoVisitante()}"
                            onclick="switchNotas('visitante')">Visitante</button>
                </div>
            </div>

            <!-- Casa -->
            <div id="notas-casa" class="notas-grid">
                <div class="nota-card" th:each="j : ${notasCasa}"
                     th:id="${'nc-' + j.slug()}">
                    <div class="nota-card__pos" th:text="${j.posicaoLabel()}"></div>
                    <div class="nota-card__nome" th:text="${j.nome()}"></div>
                    <div class="nota-card__media"
                         th:classappend="${!j.votoMinimo()} ? ' hidden' : ''"
                         th:text="${j.votoMinimo()} ? ${#numbers.formatDecimal(j.media(),1,'POINT',1,'COMMA')} : '—'"
                         th:id="${'med-' + j.slug()}"></div>
                    <div class="nota-card__votos"
                         th:text="${j.totalVotos()} + ' voto' + (${j.totalVotos()} != 1 ? 's' : '')"
                         th:id="${'cnt-' + j.slug()}"></div>
                    <div class="nota-card__stars" th:id="${'stars-' + j.slug()}">
                        <button type="button" th:each="n : ${#numbers.sequence(1, 10)}" class="star"
                                th:classappend="${j.meuVoto() != null and j.meuVoto() == n} ? ' voted' : ''"
                                th:text="${n}"
                                th:attr="data-slug=${j.slug()},data-selecao=${j.selecaoSlug()},data-nota=${n}"
                                onclick="votar(this)"></button>
                    </div>
                </div>
            </div>

            <!-- Visitante (hidden by default) -->
            <div id="notas-visitante" class="notas-grid" style="display:none">
                <div class="nota-card" th:each="j : ${notasVisitante}"
                     th:id="${'nv-' + j.slug()}">
                    <div class="nota-card__pos" th:text="${j.posicaoLabel()}"></div>
                    <div class="nota-card__nome" th:text="${j.nome()}"></div>
                    <div class="nota-card__media"
                         th:classappend="${!j.votoMinimo()} ? ' hidden' : ''"
                         th:text="${j.votoMinimo()} ? ${#numbers.formatDecimal(j.media(),1,'POINT',1,'COMMA')} : '—'"
                         th:id="${'med-' + j.slug()}"></div>
                    <div class="nota-card__votos"
                         th:text="${j.totalVotos()} + ' voto' + (${j.totalVotos()} != 1 ? 's' : '')"
                         th:id="${'cnt-' + j.slug()}"></div>
                    <div class="nota-card__stars" th:id="${'stars-' + j.slug()}">
                        <button type="button" th:each="n : ${#numbers.sequence(1, 10)}" class="star"
                                th:classappend="${j.meuVoto() != null and j.meuVoto() == n} ? ' voted' : ''"
                                th:text="${n}"
                                th:attr="data-slug=${j.slug()},data-selecao=${j.selecaoSlug()},data-nota=${n}"
                                onclick="votar(this)"></button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Chat sidebar -->
    <div class="chat-sidebar">
        <div class="chat-header">
            <h3>💬 Chat ao Vivo</h3>
            <span class="chat-online">Sala aberta</span>
        </div>

        <div class="reactions-bar">
            <button class="react-btn" onclick="reagir('⚽')" title="Golo">⚽</button>
            <button class="react-btn" onclick="reagir('🔥')" title="Fogo">🔥</button>
            <button class="react-btn" onclick="reagir('👏')" title="Palmas">👏</button>
            <button class="react-btn" onclick="reagir('😱')" title="Surpresa">😱</button>
            <button class="react-btn" onclick="reagir('💛')" title="Amor">💛</button>
            <button class="react-btn" onclick="reagir('💪')" title="Força">💪</button>
            <button class="react-btn" onclick="reagir('🎉')" title="Festa">🎉</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="msg" th:each="m : ${historico}">
                <span class="msg__nome" th:text="${m.autorNome()}"></span>
                <span th:text="${m.mensagem()}"></span>
                <span class="msg__hora" th:text="${m.criadoEm()}"></span>
            </div>
        </div>

        <div class="chat-form">
            <div class="chat-nome-row">
                <input type="text" id="chatNome" class="chat-input" placeholder="O teu nome" maxlength="40"/>
            </div>
            <div class="chat-msg-row">
                <input type="text" id="chatMsg" class="chat-input" placeholder="Escreve uma mensagem…" maxlength="300"
                       onkeydown="if(event.key==='Enter')enviar()"/>
                <button class="chat-send" onclick="enviar()">→</button>
            </div>
        </div>
    </div>

</div>

<script th:inline="javascript">
    const JOGO_ID = /*[[${partida.id()}]]*/ 0;

    // ── SSE Chat ──
    const evtChat = new EventSource('/api/jogo/' + JOGO_ID + '/chat/stream');
    evtChat.onmessage = function(e) {
        const d = JSON.parse(e.data);
        if (d.tipo === 'REACAO') {
            spawnEmoji(d.emoji);
        } else {
            appendMsg(d.autorNome, d.mensagem, d.criadoEm);
        }
    };

    // ── SSE Notas ──
    const evtNotas = new EventSource('/api/jogo/' + JOGO_ID + '/notas/stream');
    evtNotas.onmessage = function(e) {
        const d = JSON.parse(e.data);
        const med = document.getElementById('med-' + d.slug);
        const cnt = document.getElementById('cnt-' + d.slug);
        if (med) {
            med.textContent = d.votoMinimo ? d.media.toFixed(1) : '—';
            med.classList.toggle('hidden', !d.votoMinimo);
        }
        if (cnt) cnt.textContent = d.totalVotos + ' voto' + (d.totalVotos !== 1 ? 's' : '');
    };

    // ── Chat ──
    function appendMsg(nome, msg, hora) {
        const box = document.getElementById('chatMessages');
        const el = document.createElement('div');
        el.className = 'msg';
        el.innerHTML = '<span class="msg__nome">' + escHtml(nome) + '</span>' +
            escHtml(msg) + '<span class="msg__hora">' + (hora || '') + '</span>';
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
    }

    function enviar() {
        const nome = document.getElementById('chatNome').value.trim();
        const msg  = document.getElementById('chatMsg').value.trim();
        if (!nome || !msg) return;
        localStorage.setItem('copa_chat_nome', nome);
        fetch('/api/jogo/' + JOGO_ID + '/chat', {
            method:'POST',
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body:'nome='+encodeURIComponent(nome)+'&mensagem='+encodeURIComponent(msg)
        }).then(r => r.json()).then(d => {
            if (d.ok) document.getElementById('chatMsg').value = '';
        });
    }

    function reagir(emoji) {
        fetch('/api/jogo/' + JOGO_ID + '/chat/reacao', {
            method:'POST',
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body:'emoji='+encodeURIComponent(emoji)
        });
    }

    function spawnEmoji(emoji) {
        const el = document.createElement('span');
        el.className = 'react-fly';
        el.textContent = emoji;
        el.style.left  = (20 + Math.random() * 60) + '%';
        el.style.bottom = '120px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1600);
    }

    // ── Votos ──
    function votar(star) {
        const slug    = star.dataset.slug;
        const selecao = star.dataset.selecao;
        const nota    = parseInt(star.dataset.nota);
        const starsEl = document.getElementById('stars-' + slug);
        if (starsEl) starsEl.querySelectorAll('.star').forEach(s => {
            s.classList.toggle('voted', parseInt(s.dataset.nota) === nota);
            s.classList.remove('sel');
        });
        fetch('/api/jogo/' + JOGO_ID + '/notas/' + selecao + '/' + slug, {
            method:'POST',
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body:'nota='+nota
        });
    }

    // ── Tabs ──
    function switchNotas(which) {
        document.getElementById('notas-casa').style.display      = which === 'casa'      ? '' : 'none';
        document.getElementById('notas-visitante').style.display = which === 'visitante' ? '' : 'none';
        document.getElementById('tab-casa').classList.toggle('active',      which === 'casa');
        document.getElementById('tab-visitante').classList.toggle('active', which === 'visitante');
    }

    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Restore name
    const stored = localStorage.getItem('copa_chat_nome');
    if (stored) document.getElementById('chatNome').value = stored;

    // Auto-scroll chat on load
    const chatBox = document.getElementById('chatMessages');
    chatBox.scrollTop = chatBox.scrollHeight;
</script>
</body>
</html>
