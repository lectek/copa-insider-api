<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Seleções Copa 2026 — Copa Insider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/selecoes.css}"/>
    <style>
        .lang-sw { display:flex; gap:.25rem; align-items:center; }
        .lf { font-size:1.05rem; cursor:pointer; opacity:.6; text-decoration:none; border:none; background:none;
              padding:.15rem; border-radius:4px; transition:opacity .15s; }
        .lf:hover, .lf.lf-on { opacity:1; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="brand"><img src="/img/logo-sm.webp" alt="Copa Insider" style="width:36px;height:36px;object-fit:contain;"/> Copa Insider</a>
    <div class="nav-links">
        <a th:href="@{/calendario}" th:text="#{copa.nav.calendario}">Calendário</a>
        <a th:href="@{/selecoes}" class="active" th:text="#{copa.nav.selecoes}">Seleções</a>
        <a th:href="@{/comparar}" th:text="#{copa.nav.comparar}">Comparar</a>
        <a th:href="@{/loja}" th:text="#{copa.nav.loja}">Loja</a>
    </div>
    <div style="display:flex;align-items:center;gap:.5rem;">
        <div class="lang-sw">
            <a class="lf" data-lang="pt_BR" th:classappend="${#locale.country=='BR'?'lf-on':''}">🇧🇷</a>
            <a class="lf" data-lang="pt_PT" th:classappend="${#locale.country=='PT'?'lf-on':''}">🇵🇹</a>
            <a class="lf" data-lang="en"    th:classappend="${#locale.language=='en'?'lf-on':''}">🇺🇸</a>
        </div>
        <a th:href="@{/loja}" class="cta-btn" th:text="#{copa.nav.ver_guias}">Loja</a>
    </div>
</nav>
<script>document.querySelectorAll('.lf').forEach(function(a){a.style.cursor='pointer';a.addEventListener('click',function(){var p=new URLSearchParams(location.search);p.set('lang',a.dataset.lang);location.search=p.toString();});});</script>

<main>

    <section class="hero">
        <h1><span class="hl" th:text="${total}">48</span> Seleções</h1>
        <p>Grupos A–L · Copa do Mundo 2026 · EUA, Canadá &amp; México</p>
    </section>

    <section style="max-width:560px;margin:0 auto 2.5rem;padding:0 1.5rem;">
        <a th:href="@{/comparar}"
           style="display:flex;align-items:center;justify-content:center;gap:.6rem;
                  background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.25);
                  border-radius:10px;padding:.85rem 1.25rem;text-decoration:none;
                  color:#f5a623;font-weight:700;font-size:.95rem;transition:background .2s;"
           onmouseover="this.style.background='rgba(245,166,35,.18)'"
           onmouseout="this.style.background='rgba(245,166,35,.1)'">
            ⚔ Comparar duas seleções → histórico em Copas
        </a>
    </section>

    <section class="grupos">
        <div class="grupo-card" th:each="entry : ${porGrupo}">
            <div class="grupo-header">
                <span class="grupo-badge" th:text="${entry.key}"></span>
                <span class="grupo-label">Grupo</span>
            </div>
            <div class="selecoes-grid">
                <a th:each="s : ${entry.value}"
                   th:href="@{/selecoes/{slug}(slug=${s.slug()})}"
                   class="selecao-card">
                    <span class="selecao-flag" th:text="${s.bandeira()}"></span>
                    <div class="selecao-info">
                        <span class="selecao-nome" th:text="${s.nome()}"></span>
                        <span class="selecao-conf" th:text="${s.confederacao()}"></span>
                    </div>
                    <div class="selecao-meta">
                        <span class="participacoes" th:text="${s.participacoes()} + '×'"></span>
                    </div>
                </a>
            </div>
        </div>
    </section>

</main>

<footer class="footer">
    <p>© 2026 Copa Insider · Conteúdo a partir de <strong>€1</strong></p>
</footer>

</body>
</html>
