<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/public-head :: head(
    'Copa em Factos',
    'Curiosidades, recordes e estatísticas surpreendentes sobre a Copa do Mundo.',
    '/img/og-copa.webp',
    'factos',
    '/css/factos.css')}"></head>
<body>

<nav th:replace="~{fragments/site-nav :: nav('factos')}"></nav>
<th:block th:replace="~{fragments/site-nav :: lang-js}"></th:block>

<main>
    <section class="hero">
        <span class="hero-icon">⚽</span>
        <h1>Copa em <span th:text="${quantidade}">20</span> Factos</h1>
        <p>Curiosidades, recordes e estatísticas surpreendentes sobre a Copa do Mundo.</p>
        <a th:href="@{/factos}" class="btn-gerar" id="btn-gerar">
            <span class="label">🔀 Gerar novos factos</span>
            <span class="spin">↻</span>
        </a>
    </section>

    <!-- Filtros por categoria -->
    <div class="filtros" id="filtros">
        <button class="filtro-btn ativo" data-cat="todos">Todos</button>
        <button th:each="cat : ${categorias}"
                class="filtro-btn"
                th:data-cat="${cat}"
                th:text="${cat}">Categoria</button>
    </div>

    <!-- Grid de factos -->
    <div class="grid" id="grid-factos" th:if="${!fatos.isEmpty()}">
        <div th:each="f, iter : ${fatos}"
             class="fato-card"
             th:data-cat="${f.categoria()}">
            <span class="fato-num" th:text="${iter.index + 1}">1</span>
            <div class="fato-header">
                <span class="fato-icone" th:text="${f.icone()}">⚽</span>
                <span class="fato-cat"
                      th:classappend="'cat-' + ${f.categoria().replace(' ', '-')}"
                      th:text="${f.categoria()}">Categoria</span>
            </div>
            <div class="fato-titulo" th:text="${f.titulo()}">Título do facto</div>
            <div class="fato-desc" th:text="${f.descricao()}">Descrição detalhada do facto curioso.</div>
        </div>
    </div>

    <p class="vazio" th:if="${fatos.isEmpty()}">
        Sem factos disponíveis de momento. Tenta novamente em breve.
    </p>
</main>

<footer th:replace="~{fragments/site-footer :: footer}"></footer>

<script>
    // Filtro por categoria (client-side)
    var filtros = document.querySelectorAll('.filtro-btn');
    var cards   = document.querySelectorAll('.fato-card');

    filtros.forEach(function(btn) {
        btn.addEventListener('click', function() {
            filtros.forEach(function(b) { b.classList.remove('ativo'); });
            btn.classList.add('ativo');

            var cat = btn.getAttribute('data-cat');
            cards.forEach(function(card) {
                card.style.display = (cat === 'todos' || card.getAttribute('data-cat') === cat)
                    ? '' : 'none';
            });
        });
    });

    // Animação do botão gerar
    document.getElementById('btn-gerar').addEventListener('click', function(e) {
        this.classList.add('loading');
    });
</script>
</body>
</html>
