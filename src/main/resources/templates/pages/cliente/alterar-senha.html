<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Alterar Senha — Copa Insider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0f; color: #e8e8f0; font-family: 'Inter', sans-serif; min-height: 100vh; }

        .navbar { display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 2rem; background: rgba(10,10,15,.95);
            border-bottom: 1px solid rgba(255,255,255,.07); position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: .5rem; text-decoration: none;
            color: #e8e8f0; font-weight: 800; font-size: 1.1rem; }
        .brand-badge { background: #f5a623; color: #0a0a0f; padding: .15rem .4rem;
            border-radius: 4px; font-size: .75rem; font-weight: 800; }
        .nav-links { display: flex; gap: 1.5rem; }
        .nav-links a { color: #9090a8; text-decoration: none; font-size: .9rem; font-weight: 500; transition: color .2s; }
        .nav-links a:hover { color: #f5a623; }
        .nav-actions { display: flex; align-items: center; gap: .75rem; }
        .cta-btn { background: #f5a623; color: #0a0a0f; padding: .4rem 1rem;
            border-radius: 6px; text-decoration: none; font-weight: 700; font-size: .85rem; }
        .logout-link { color: #9090a8; text-decoration: none; font-size: .85rem;
            font-weight: 500; transition: color .2s; }
        .logout-link:hover { color: #e05252; }

        .acc-wrap { max-width: 540px; margin: 2.5rem auto; padding: 0 1.25rem 5rem; }
        .acc-back { display: inline-flex; align-items: center; gap: .35rem; color: #9090a8;
            text-decoration: none; font-size: .85rem; margin-bottom: 1.5rem; transition: color .2s; }
        .acc-back:hover { color: #f5a623; }
        .acc-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 1.5rem; }

        .acc-form-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
            border-radius: 16px; padding: 2rem; }

        .acc-form-group { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1.1rem; }
        .acc-form-group label { font-size: .78rem; font-weight: 600; color: #c0c0d8;
            text-transform: uppercase; letter-spacing: .04em; }
        .acc-form-group input { padding: .65rem .9rem; border-radius: 8px;
            border: 1px solid rgba(255,255,255,.12); font-size: .95rem; font-family: inherit;
            background: rgba(255,255,255,.06); color: #e8e8f0; transition: border-color .15s; }
        .acc-form-group input:focus { outline: none; border-color: #f5a623; }
        .acc-field-error { color: #e05252; font-size: .8rem; }
        .acc-password-hint { font-size: .78rem; color: #c8c8e0; margin-top: .2rem;
            background: rgba(255,255,255,.03); padding: .6rem .75rem;
            border-radius: 8px; line-height: 1.5; }

        .acc-actions { display: flex; gap: .75rem; align-items: center; margin-top: 1.5rem; flex-wrap: wrap; }
        .btn-primary { background: #f5a623; color: #0a0a0f; border: none; padding: .65rem 1.5rem;
            border-radius: 8px; font-size: .95rem; font-weight: 700; cursor: pointer;
            font-family: inherit; transition: opacity .2s; }
        .btn-primary:hover { opacity: .9; }
        .btn-outline { background: transparent; color: #b0b0c8; border: 1px solid rgba(255,255,255,.15);
            padding: .65rem 1.5rem; border-radius: 8px; font-size: .95rem; font-weight: 600;
            cursor: pointer; font-family: inherit; text-decoration: none; transition: border-color .2s, color .2s; }
        .btn-outline:hover { border-color: rgba(255,255,255,.3); color: #e8e8f0; }

        .acc-recovery { margin-top: 1.25rem; padding-top: 1.25rem;
            border-top: 1px solid rgba(255,255,255,.08);
            font-size: .82rem; color: #9090a8; }
        .acc-recovery a { color: #f5a623; text-decoration: none; }
        .acc-recovery a:hover { text-decoration: underline; }

        @media (max-width: 640px) {
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="brand"><img src="/img/logo-sm.webp" alt="Copa Insider" style="width:36px;height:36px;object-fit:contain;"/> Copa Insider</a>
    <div class="nav-links">
        <a th:href="@{/calendario}">Calendário</a>
        <a th:href="@{/selecoes}">Seleções</a>
        <a th:href="@{/comparar}">Comparar</a>
        <a th:href="@{/loja}">Loja</a>
    </div>
    <div class="nav-actions">
        <a th:href="@{/loja}" class="cta-btn">Loja</a>
        <a th:href="@{/auth/logout}" class="logout-link">Sair</a>
    </div>
</nav>

<main>
    <div class="acc-wrap">
        <a th:href="@{/cliente/conta}" class="acc-back">← Minha Conta</a>
        <h1 class="acc-title">Alterar Senha</h1>

        <div class="acc-form-card">
            <form th:action="@{/cliente/senha}" method="post" th:object="${form}" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="acc-form-group">
                    <label for="senhaAtual">Senha atual</label>
                    <input id="senhaAtual" type="password" th:field="*{senhaAtual}"
                           placeholder="••••••••" autocomplete="current-password"/>
                    <span class="acc-field-error" th:if="${#fields.hasErrors('senhaAtual')}"
                          th:errors="*{senhaAtual}"></span>
                </div>

                <div class="acc-form-group">
                    <label for="novaSenha">Nova senha</label>
                    <input id="novaSenha" type="password" th:field="*{novaSenha}"
                           placeholder="••••••••" autocomplete="new-password"/>
                    <span class="acc-field-error" th:if="${#fields.hasErrors('novaSenha')}"
                          th:errors="*{novaSenha}"></span>
                    <div class="acc-password-hint">
                        Mínimo 8 caracteres · maiúscula · minúscula · número · caractere especial
                    </div>
                </div>

                <div class="acc-form-group">
                    <label for="confirmarNovaSenha">Confirmar nova senha</label>
                    <input id="confirmarNovaSenha" type="password" th:field="*{confirmarNovaSenha}"
                           placeholder="••••••••" autocomplete="new-password"/>
                    <span class="acc-field-error" th:if="${#fields.hasErrors('confirmarNovaSenha')}"
                          th:errors="*{confirmarNovaSenha}"></span>
                </div>

                <div class="acc-actions">
                    <button type="submit" class="btn-primary">Guardar nova senha</button>
                    <a th:href="@{/cliente/conta}" class="btn-outline">Cancelar</a>
                </div>
            </form>

            <div class="acc-recovery" th:if="${passwordRecoveryAvailable}">
                Esqueceu a senha?
                <a th:href="@{/auth/reset(email=${passwordRecoveryEmail})}">
                    Recuperar via e-mail (<span th:text="${passwordRecoveryMaskedEmail}">ex***@...</span>)
                </a>
            </div>
        </div>
    </div>
</main>

<footer style="text-align:center;padding:2rem;color:#555;font-size:.85rem;border-top:1px solid rgba(255,255,255,.06);">
    <p>© 2026 Copa Insider</p>
</footer>

</body>
</html>
