<!-- src/main/resources/templates/produtos/produtos.html -->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Catálogo • Produtos</title>

  <!-- CSS global com cache-busting -->
  <link rel="stylesheet"
        th:href="@{/css/main.css(v=${#dates.createNow().time})}"/>
  <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
  <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="body-flex">
<header th:replace="~{fragments/header :: header}"></header>

<div class="layout layout--with-sidebar">
  <aside th:replace="~{fragments/sidebar :: sidebar('produtos')}"></aside>

  <main class="container stack mt-4 mb-8"
        id="conteudo"
        role="main"
        aria-label="Catálogo de produtos">
    <div class="between mb-4">
      <h1 class="page-title">Catálogo</h1>

      <!-- busca rápida -->
      <form id="form-busca"
            class="form-row gap-2"
            role="search"
            aria-label="Buscar no catálogo">
        <input class="input"
               id="q"
               name="q"
               placeholder="Buscar por nome ou EAN…"
               th:value="${q}"/>
        <button class="btn" type="submit">Buscar</button>
        <button class="btn btn-ghost" type="button" id="btn-limpar">Limpar</button>
      </form>
    </div>

    <!-- grid -->
    <section id="catalogo-grid"
             class="grid grid-4 gap-4"
             aria-live="polite">
      <!-- o JS popula -->
    </section>

    <!-- paginação -->
    <div class="center mt-6">
      <button class="btn btn-ghost" id="btn-prev" disabled>Anterior</button>
      <span id="paginacao-info" class="mx-3 text-muted">Página 1</span>
      <button class="btn" id="btn-next" disabled>Próxima</button>
    </div>
  </main>
</div>

<footer th:replace="~{fragments/footer-client :: footer}"></footer>

<script th:inline="javascript">
  /*<![CDATA[*/
  window.CATALOGO_CTX = {
    isAdmin: /*[[${isAdmin}]]*/ false
  };
  /*]]>*/
</script>
<script defer th:src="@{/js/pages/catalogo.js}"></script>
</body>
</html>
