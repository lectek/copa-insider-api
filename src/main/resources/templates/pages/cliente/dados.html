<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Meus Dados — Copa Insider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0f; color: #e8e8f0; font-family: 'Inter', sans-serif; min-height: 100vh; }

        .navbar { display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 2rem; background: rgba(10,10,15,.95);
            border-bottom: 1px solid rgba(255,255,255,.07); position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: .5rem; text-decoration: none;
            color: #e8e8f0; font-weight: 800; font-size: 1.1rem; }
        .brand-badge { background: #f5a623; color: #0a0a0f; padding: .15rem .4rem;
            border-radius: 4px; font-size: .75rem; font-weight: 800; }
        .nav-links { display: flex; gap: 1.5rem; }
        .nav-links a { color: #9090a8; text-decoration: none; font-size: .9rem; font-weight: 500; transition: color .2s; }
        .nav-links a:hover { color: #f5a623; }
        .nav-actions { display: flex; align-items: center; gap: .75rem; }
        .cta-btn { background: #f5a623; color: #0a0a0f; padding: .4rem 1rem;
            border-radius: 6px; text-decoration: none; font-weight: 700; font-size: .85rem; }
        .logout-link { color: #9090a8; text-decoration: none; font-size: .85rem;
            font-weight: 500; transition: color .2s; }
        .logout-link:hover { color: #e05252; }

        .acc-wrap { max-width: 640px; margin: 2.5rem auto; padding: 0 1.25rem 5rem; }
        .acc-back { display: inline-flex; align-items: center; gap: .35rem; color: #9090a8;
            text-decoration: none; font-size: .85rem; margin-bottom: 1.5rem; transition: color .2s; }
        .acc-back:hover { color: #f5a623; }
        .acc-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 1.5rem; }

        .acc-form-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
            border-radius: 16px; padding: 2rem; }

        .acc-avatar-section { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.75rem;
            padding-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,.08); }
        .acc-avatar-img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
            background: #2a2a3e; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 700; color: #f5a623; flex-shrink: 0; overflow: hidden; }
        .acc-avatar-img img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
        .acc-avatar-info strong { font-size: .9rem; color: #e8e8f0; }
        .acc-avatar-info p { font-size: .8rem; color: #9090a8; margin-top: .2rem; }

        .acc-form-group { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1.1rem; }
        .acc-form-group label { font-size: .78rem; font-weight: 600; color: #9090a8;
            text-transform: uppercase; letter-spacing: .04em; }
        .acc-form-group input { padding: .65rem .9rem; border-radius: 8px;
            border: 1px solid rgba(255,255,255,.12); font-size: .95rem; font-family: inherit;
            background: rgba(255,255,255,.06); color: #e8e8f0; transition: border-color .15s; }
        .acc-form-group input:focus { outline: none; border-color: #f5a623; }
        .acc-form-group input[readonly] { background: rgba(255,255,255,.03); color: #6060a0; cursor: default; }
        .acc-field-error { color: #e05252; font-size: .8rem; }

        .acc-actions { display: flex; gap: .75rem; align-items: center; margin-top: 1.5rem; flex-wrap: wrap; }
        .btn-primary { background: #f5a623; color: #0a0a0f; border: none; padding: .65rem 1.5rem;
            border-radius: 8px; font-size: .95rem; font-weight: 700; cursor: pointer;
            font-family: inherit; transition: opacity .2s; }
        .btn-primary:hover { opacity: .9; }
        .btn-outline { background: transparent; color: #9090a8; border: 1px solid rgba(255,255,255,.15);
            padding: .65rem 1.5rem; border-radius: 8px; font-size: .95rem; font-weight: 600;
            cursor: pointer; font-family: inherit; text-decoration: none; transition: border-color .2s, color .2s; }
        .btn-outline:hover { border-color: rgba(255,255,255,.3); color: #e8e8f0; }

        @media (max-width: 640px) {
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="brand"><img src="/img/logo-sm.webp" alt="Copa Insider" style="width:36px;height:36px;object-fit:contain;"/> Copa Insider</a>
    <div class="nav-links">
        <a th:href="@{/calendario}">Calendário</a>
        <a th:href="@{/selecoes}">Seleções</a>
        <a th:href="@{/comparar}">Comparar</a>
        <a th:href="@{/loja}">Loja</a>
    </div>
    <div class="nav-actions">
        <a th:href="@{/loja}" class="cta-btn">Loja</a>
        <a th:href="@{/auth/logout}" class="logout-link">Sair</a>
    </div>
</nav>

<main>
    <div class="acc-wrap">
        <a th:href="@{/cliente/conta}" class="acc-back">← Minha Conta</a>
        <h1 class="acc-title">Meus Dados</h1>

        <div class="acc-form-card">
            <!-- Avatar -->
            <div class="acc-avatar-section">
                <div class="acc-avatar-img">
                    <img th:if="${avatarUrl != null}" th:src="${avatarUrl}" alt="Avatar"/>
                    <span th:unless="${avatarUrl != null}"
                          th:text="${avatarNome != null ? #strings.substring(avatarNome,0,1).toUpperCase() : '?'}">?</span>
                </div>
                <div class="acc-avatar-info">
                    <strong>Foto de perfil</strong>
                    <p>PNG, JPG ou WEBP · Máx 2 MB</p>
                    <form th:action="@{/cliente/avatar}" method="post" enctype="multipart/form-data"
                          style="margin-top:.5rem;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="file" name="file" accept="image/png,image/jpeg,image/webp"
                               style="font-size:.82rem;color:#c0c0d8;" onchange="this.form.submit()"/>
                    </form>
                </div>
            </div>

            <!-- Profile form -->
            <form th:action="@{/cliente/dados}" method="post" th:object="${form}" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="acc-form-group">
                    <label for="nome">Nome completo</label>
                    <input id="nome" type="text" th:field="*{nome}" placeholder="O teu nome" maxlength="120"/>
                    <span class="acc-field-error" th:if="${#fields.hasErrors('nome')}"
                          th:errors="*{nome}"></span>
                </div>

                <div class="acc-form-group">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" th:field="*{email}" placeholder="email@exemplo.com" maxlength="150"/>
                    <span class="acc-field-error" th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}"></span>
                </div>

                <div class="acc-form-group">
                    <label for="cpf">CPF</label>
                    <input id="cpf" type="text" th:field="*{cpf}" placeholder="000.000.000-00"
                           maxlength="14" readonly/>
                </div>

                <div class="acc-form-group">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" type="tel" th:field="*{telefone}" placeholder="+351 912 345 678" maxlength="25"/>
                    <span class="acc-field-error" th:if="${#fields.hasErrors('telefone')}"
                          th:errors="*{telefone}"></span>
                </div>

                <div class="acc-form-group">
                    <label for="endereco">Endereço</label>
                    <input id="endereco" type="text" th:field="*{endereco}" placeholder="Rua, número, cidade" maxlength="200"/>
                    <span class="acc-field-error" th:if="${#fields.hasErrors('endereco')}"
                          th:errors="*{endereco}"></span>
                </div>

                <div class="acc-actions">
                    <button type="submit" class="btn-primary">Guardar alterações</button>
                    <a th:href="@{/cliente/conta}" class="btn-outline">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer style="text-align:center;padding:2rem;color:#555;font-size:.85rem;border-top:1px solid rgba(255,255,255,.06);">
    <p>© 2026 Copa Insider</p>
</footer>

</body>
</html>
