<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meus pedidos - Embalando Soluções em Enbalagens e Bomboniere</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body class="body-flex">
  <header th:replace="~{fragments/header :: header}"></header>

  <div class="layout layout--with-sidebar">
    <aside th:replace="~{fragments/sidebar :: sidebar('pedidos')}"></aside>

    <main id="main-content" class="container stack mt-4 mb-8" role="main">
      <h1 class="page-title">Meus pedidos</h1>

      <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

      <section class="card table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>#</th>
              <th>Data</th>
              <th>Total</th>
              <th>Pagamento</th>
              <th>Status</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${pedidos}">
              <td th:text="${p.id}">0001</td>
              <td th:text="${#temporals.format(p.data, 'dd/MM/yyyy HH:mm')}">--</td>
              <td th:text="${#numbers.formatCurrency(p.total)}">R$ 0,00</td>
              <td th:text="${p.metodoPagamento}">PIX</td>
              <td><span class="badge" th:text="${p.status}">STATUS</span></td>
              <td class="actions">
                <a class="btn btn-ghost" th:href="@{|/cliente/pedidos/${p.id}|}">Detalhes</a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pedidos)}">
              <td colspan="6" class="text-center text-muted">Nenhum pedido encontrado.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <footer th:replace="~{fragments/footer-client :: footer}"></footer>
</body>
</html>
