<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<aside th:fragment="sidebar" class="ci-sidebar">
    <div class="ci-sidebar__brand">
        <img th:src="@{/img/logo.svg}" alt="Copa Insider" class="ci-sidebar__logo"/>
        <span class="ci-sidebar__label">Admin</span>
    </div>

    <nav class="ci-sidebar__nav">
        <p class="ci-sidebar__section">Visão Geral</p>
        <a th:href="@{/admin/dashboard}" class="ci-sidebar__link"
           th:classappend="${#strings.startsWith(currentUri, '/admin/dashboard')} ? 'is-active'">
            Dashboard
        </a>

        <p class="ci-sidebar__section">Copa 2026</p>
        <a th:href="@{/admin/copa/produtos}" class="ci-sidebar__link"
           th:classappend="${#strings.startsWith(currentUri, '/admin/copa/produtos')} ? 'is-active'">
            Produtos
        </a>
        <a th:href="@{/admin/copa/compras}" class="ci-sidebar__link"
           th:classappend="${#strings.startsWith(currentUri, '/admin/copa/compras')} ? 'is-active'">
            Compras
        </a>
        <a th:href="@{/admin/copa/acessos}" class="ci-sidebar__link"
           th:classappend="${#strings.startsWith(currentUri, '/admin/copa/acessos')} ? 'is-active'">
            Acessos
        </a>

        <p class="ci-sidebar__section">Utilizadores</p>
        <a th:href="@{/admin/usuarios}" class="ci-sidebar__link"
           th:classappend="${#strings.startsWith(currentUri, '/admin/usuarios')} ? 'is-active'">
            Utilizadores
        </a>

        <p class="ci-sidebar__section">Comunicação</p>
        <a th:href="@{/admin/notificacoes}" class="ci-sidebar__link"
           th:classappend="${#strings.startsWith(currentUri, '/admin/notificacoes')} ? 'is-active'">
            Notificações
        </a>
        <a th:href="@{/admin/marketing}" class="ci-sidebar__link"
           th:classappend="${#strings.startsWith(currentUri, '/admin/marketing')} ? 'is-active'">
            Marketing
        </a>

        <p class="ci-sidebar__section">Sistema</p>
        <a th:href="@{/admin/configuracoes}" class="ci-sidebar__link"
           th:classappend="${#strings.startsWith(currentUri, '/admin/configuracoes')} ? 'is-active'">
            Configurações
        </a>
    </nav>

    <div class="ci-sidebar__footer">
        <a th:href="@{/}" class="ci-sidebar__site-link">← Ir para o site</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="ci-sidebar__logout">Sair</button>
        </form>
    </div>
</aside>

</body>
</html>
