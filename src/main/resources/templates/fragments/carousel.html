<th:block th:fragment="carousel">
  <section class="carousel" aria-label="Produtos em destaque">
    <div class="carousel__viewport" id="carousel-viewport" tabindex="0" aria-live="polite"></div>

    <button class="carousel__btn prev" id="carousel-prev" aria-label="Anterior">‹</button>
    <button class="carousel__btn next" id="carousel-next" aria-label="Próximo">›</button>

    <div class="carousel__dots" id="carousel-dots" role="tablist" aria-label="Páginas do carrossel"></div>
  </section>
</th:block>
