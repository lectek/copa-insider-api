<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<body>

<th:block th:fragment="footer">
    <footer class="footer">
        <p>© 2026 Copa Insider · <a th:href="@{/loja}">Guias digitais</a> a partir de <strong>€1,99</strong></p>
    </footer>
    <!-- Converte horários UTC → fuso local do utilizador em todos os .utc-time -->
    <script>
    (function () {
        document.querySelectorAll('.utc-time[data-utc-ms]').forEach(function (el) {
            var ms = parseInt(el.dataset.utcMs, 10);
            if (isNaN(ms)) return;
            el.textContent = new Date(ms).toLocaleTimeString(undefined, {
                hour: '2-digit', minute: '2-digit', hour12: false
            });
        });
    }());
    </script>
</th:block>

</body>
</html>
