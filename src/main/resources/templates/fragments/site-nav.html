<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt">
<body>

<!--
  Fragment: site-nav(pagina)

  Uso:
    <nav th:replace="~{fragments/site-nav :: nav('calendario')}"></nav>

  pagina → identifica o link activo: 'calendario', 'selecoes', 'comparar', 'loja', 'factos', 'ranking'
-->
<nav th:fragment="nav(pagina)" class="navbar" id="site-navbar">

    <!-- Hamburger (mobile) -->
    <button class="navbar__hamburger" aria-label="Menu" aria-expanded="false"
            aria-controls="navbar-links" id="navbar-hamburger" type="button">
        <span></span><span></span><span></span>
    </button>

    <a href="/" class="brand">
        <img src="/img/logo-sm.webp" alt="Copa Insider" width="36" height="36"
             style="object-fit:contain;"/>
        Copa Insider
    </a>

    <div class="nav-links" id="navbar-links">
        <a th:href="@{/ao-vivo}" class="nav-live-link"
           th:classappend="${pagina == 'ao-vivo'} ? 'active'">🔴 Ao Vivo</a>
        <a th:href="@{/classificacao}"
           th:classappend="${pagina == 'classificacao'} ? 'active'">Classificação</a>
        <a th:href="@{/bracket}"
           th:classappend="${pagina == 'bracket'} ? 'active'">Bracket</a>
        <a th:href="@{/calendario}" th:text="#{copa.nav.calendario}"
           th:classappend="${pagina == 'calendario'} ? 'active'">Calendário</a>
        <a th:href="@{/selecoes}" th:text="#{copa.nav.selecoes}"
           th:classappend="${pagina == 'selecoes'} ? 'active'">Seleções</a>
        <a th:href="@{/comparar}" th:text="#{copa.nav.comparar}"
           th:classappend="${pagina == 'comparar'} ? 'active'">Comparar</a>
        <a th:href="@{/factos}"
           th:classappend="${pagina == 'factos'} ? 'active'">Factos</a>
        <a th:href="@{/loja}" th:text="#{copa.nav.loja}"
           th:classappend="${pagina == 'loja'} ? 'active'">Loja</a>
    </div>

    <div class="navbar__actions">
        <!-- Ao Vivo sempre visível no mobile (fora do menu hamburger) -->
        <a th:href="@{/ao-vivo}" class="nav-live-mobile"
           th:classappend="${pagina == 'ao-vivo'} ? 'active'">🔴 Ao Vivo</a>
        <div class="lang-sw">
            <a class="lf" data-lang="pt_BR"
               th:classappend="${#locale.country=='BR'} ? 'lf-on'">🇧🇷</a>
            <a class="lf" data-lang="pt_PT"
               th:classappend="${#locale.country=='PT'} ? 'lf-on'">🇵🇹</a>
            <a class="lf" data-lang="en"
               th:classappend="${#locale.language=='en'} ? 'lf-on'">🇺🇸</a>
        </div>
        <th:block th:replace="~{::sessionLinks}"></th:block>
    </div>

    <script>
    (function(){
        var nav = document.getElementById('site-navbar');
        var btn = document.getElementById('navbar-hamburger');
        if (!nav || !btn) return;
        function isOpen(){ return nav.classList.contains('navbar--open'); }
        function open(){ nav.classList.add('navbar--open'); btn.setAttribute('aria-expanded','true'); document.body.classList.add('nav-menu-open'); }
        function close(){ nav.classList.remove('navbar--open'); btn.setAttribute('aria-expanded','false'); document.body.classList.remove('nav-menu-open'); }
        btn.addEventListener('click', function(e){ e.stopPropagation(); isOpen() ? close() : open(); });
        document.addEventListener('click', function(e){ if(isOpen() && !nav.contains(e.target)) close(); });
        document.addEventListener('keydown', function(e){ if(e.key==='Escape' && isOpen()) close(); });
        window.addEventListener('resize', function(){ if(window.innerWidth > 768 && isOpen()) close(); });
        /* fechar ao clicar em link interno */
        var links = document.querySelectorAll('#navbar-links a');
        links.forEach(function(a){ a.addEventListener('click', function(){ if(window.innerWidth <= 768) close(); }); });
    }());
    </script>

</nav>

<!-- Fragment: sessionLinks — única fonte de verdade para Acessos/Admin/Sair/Login,
     reutilizada pelas páginas com navbar próprio para evitar links desatualizados -->
<th:block th:fragment="sessionLinks">
    <a th:href="@{/conta/acessos}" sec:authorize="isAuthenticated() and !hasAnyRole('ADMIN','DEVELOPER')"
       class="navbar__acessos-link">Os meus acessos</a>
    <a th:href="@{/admin/dashboard}" sec:authorize="hasAnyRole('ADMIN','DEVELOPER')"
       class="navbar__admin-link">⚙ Admin</a>
    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" style="display:inline;margin:0;padding:0;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="navbar__logout-link">Sair</button>
    </form>
    <a th:href="@{/auth/login}" sec:authorize="!isAuthenticated()"
       class="cta-btn">Login</a>
</th:block>

<!-- Lang switcher JS (inline porque é tiny e precisa de correr antes do DOMContentLoaded) -->
<script th:fragment="lang-js">
document.querySelectorAll('.lf[data-lang]').forEach(function(a){
    a.addEventListener('click',function(){
        var p=new URLSearchParams(location.search);
        p.set('lang',a.dataset.lang);
        location.search=p.toString();
    });
});
</script>

</body>
</html>
