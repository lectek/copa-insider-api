<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Card de produto -->
<th:block th:fragment="card(p)">
  <article class="catalog-product-card"
           th:with="outOfStock=${p.estoque != null and p.estoque <= 0},
                    unavailable=${!p.disponivel or outOfStock},
                    hasDiscount=${p.precoDe != null and p.precoDe > p.preco}">
    <div class="catalog-product-card__header">
      <span class="catalog-product-card__badge"
            th:if="${hasDiscount and p.descontoPercentual != null and p.descontoPercentual > 0}"
            th:text="${p.descontoPercentual + '% OFF'}">20% OFF</span>
      <span class="catalog-product-card__availability"
            th:if="${unavailable}"
            th:text="${!p.disponivel ? 'Indisponivel' : 'Sem estoque'}">Sem estoque</span>
    </div>

    <a class="catalog-product-card__media" th:href="@{'/produto/' + ${p.id}}">
      <img th:src="${p.imagem} ?: @{/img/produtos/placeholder-generico.png}"
           th:alt="${p.nome}" loading="lazy"
           onerror="this.src='/img/produtos/placeholder-generico.png'">
    </a>

    <div class="catalog-product-card__content">
      <span class="catalog-product-card__category" th:text="${p.categoria} ?: 'Produto'">Categoria</span>
      <a class="catalog-product-card__title"
         th:href="@{'/produto/' + ${p.id}}"
         th:text="${p.nome}">Nome do produto</a>

      <div class="catalog-product-card__price-block">
        <span class="catalog-product-card__price-old"
              th:if="${hasDiscount}"
              th:text="${#numbers.formatCurrency(p.precoDe)}">R$ 0,00</span>
        <strong class="catalog-product-card__price-now"
                th:text="${#numbers.formatCurrency(p.preco)}">R$ 0,00</strong>
        <span class="catalog-product-card__price-note">no pix ou cartao a vista</span>
      </div>

      <div class="catalog-product-card__delivery"
           th:if="${deliveryEstimate != null}"
           th:classappend="${deliveryEstimate.available} ? ' is-available' : ' is-unavailable'">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h9A2.5 2.5 0 0 1 17 7.5V8h1.17a2.5 2.5 0 0 1 2 1l1.33 1.78V15a2 2 0 0 1-2 2h-.59a2.91 2.91 0 0 1-5.82 0H10.9a2.91 2.91 0 0 1-5.82 0H4.5A1.5 1.5 0 0 1 3 15.5v-8Zm2.5-1a1 1 0 0 0-1 1v7.99l.76.01a2.91 2.91 0 0 1 5.48 0h2.52A2.91 2.91 0 0 1 18.74 15H19.5a.5.5 0 0 0 .5-.5v-3.22l-1.03-1.37a1 1 0 0 0-.8-.41H17v2a1 1 0 0 1-1 1h-1v-1.5h.5V6.5h-10ZM8 18.4a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Zm8 0a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Z"/>
        </svg>
        <div class="catalog-product-card__delivery-copy">
          <span class="catalog-product-card__delivery-main"
                th:text="${deliveryEstimate.summary}">Entrega hoje por volta de 14:35</span>
          <small class="catalog-product-card__delivery-sub"
                 th:if="${deliveryEstimate.detail != null and !#strings.isEmpty(deliveryEstimate.detail)}"
                 th:text="${deliveryEstimate.detail}">Parada 3 de 12 na rota.</small>
        </div>
      </div>
    </div>

    <div class="catalog-product-card__actions">
      <a class="catalog-product-card__details"
         th:href="@{'/produto/' + ${p.id}}">Detalhes</a>
      <form th:if="${#authorization != null and #authorization.expression('isAuthenticated()')}"
            th:action="@{/carrinho/adicionar}"
            method="post"
            class="catalog-product-card__cart-form">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="produtoId" th:value="${p.id}"/>
        <input type="hidden" name="quantidade" value="1"/>
        <button type="submit" class="catalog-product-card__cart-btn"
                th:disabled="${unavailable}"
                th:attr="aria-disabled=${unavailable}">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 6V5a5 5 0 0 1 10 0v1h2a1 1 0 0 1 1 1l-.75 10.2A2 2 0 0 1 17.26 19H6.74a2 2 0 0 1-1.99-1.8L4 7a1 1 0 0 1 1-1h2Zm2 0h6V5a3 3 0 0 0-6 0v1Zm3 7.5a1 1 0 0 0 1-1v-1h-2v1a1 1 0 0 0 1 1Z"/>
          </svg>
          <span th:text="${unavailable ? 'Indisponivel' : 'Adicionar'}">Adicionar</span>
        </button>
      </form>
      <a th:if="${(#authorization == null or #authorization.expression('isAnonymous()')) and !unavailable}"
         class="catalog-product-card__cart-btn"
         th:href="@{/auth/login(redirect=${'/produto/' + p.id})}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 6V5a5 5 0 0 1 10 0v1h2a1 1 0 0 1 1 1l-.75 10.2A2 2 0 0 1 17.26 19H6.74a2 2 0 0 1-1.99-1.8L4 7a1 1 0 0 1 1-1h2Zm2 0h6V5a3 3 0 0 0-6 0v1Zm3 7.5a1 1 0 0 0 1-1v-1h-2v1a1 1 0 0 0 1 1Z"/>
        </svg>
        <span>Entrar para comprar</span>
      </a>
      <button th:if="${(#authorization == null or #authorization.expression('isAnonymous()')) and unavailable}"
              type="button"
              class="catalog-product-card__cart-btn"
              disabled
              aria-disabled="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 6V5a5 5 0 0 1 10 0v1h2a1 1 0 0 1 1 1l-.75 10.2A2 2 0 0 1 17.26 19H6.74a2 2 0 0 1-1.99-1.8L4 7a1 1 0 0 1 1-1h2Zm2 0h6V5a3 3 0 0 0-6 0v1Zm3 7.5a1 1 0 0 0 1-1v-1h-2v1a1 1 0 0 0 1 1Z"/>
        </svg>
        <span>Indisponivel</span>
      </button>
    </div>
  </article>
</th:block>

<!-- Grid de cards -->
<th:block th:fragment="gridVM(lista)">
  <div class="home-cards">
    <div th:each="p : ${lista}">
      <div th:replace="~{fragments/cards :: card(${p})}"></div>
    </div>
  </div>
</th:block>

<!-- Item rico de carrossel da home -->
<th:block th:fragment="homeCarouselItem(p)">
  <article class="carousel__item"
           th:with="outOfStock=${p.estoque != null and p.estoque <= 0}">
    <a class="carousel__media" th:href="@{'/produto/' + ${p.id}}">
      <span class="carousel__badge"
            th:if="${!p.disponivel or outOfStock}"
            th:text="${!p.disponivel ? 'Indisponivel' : 'Sem estoque'}">
        Sem estoque
      </span>
      <img class="carousel__img"
           th:src="${p.imagem} ?: @{/img/produtos/placeholder-generico.png}"
           th:alt="${p.nome}" loading="lazy"
           onerror="this.src='/img/produtos/placeholder-generico.png'"/>
    </a>
    <div class="carousel__info">
      <span class="carousel__eyebrow" th:text="${p.categoria} ?: 'Categoria'">Categoria</span>
      <h3 class="carousel__title" th:text="${p.nome}">Nome</h3>
      <p class="carousel__meta"
         th:text="${!p.disponivel ? 'Produto indisponivel no momento' : (outOfStock ? 'Sem estoque no momento' : 'Disponivel para entrega rapida')}">
        Disponivel para entrega rapida
      </p>
      <div class="carousel__price-wrap">
        <span class="carousel__price" th:text="${#numbers.formatCurrency(p.preco)}">R$ 0,00</span>
      </div>
      <div class="carousel__actions">
        <a class="carousel__cta" th:href="@{'/produto/' + ${p.id}}">Ver produto</a>
      </div>
    </div>
  </article>
</th:block>

<!-- Carrossel da home -->
<th:block th:fragment="homeCarouselVM(lista, carouselKey, carouselStyle, ariaLabel)">
  <section class="carousel"
           data-carousel
           th:classappend="${carouselStyle != null and !carouselStyle.isBlank()} ? ' carousel--' + ${carouselStyle} : ' carousel--classic'"
           th:attr="data-carousel-key=${carouselKey}, aria-label=${ariaLabel}">
    <div class="carousel__viewport" aria-live="polite">
      <th:block th:each="p : ${lista}">
        <div th:replace="~{fragments/cards :: homeCarouselItem(${p})}"></div>
      </th:block>
    </div>
    <button class="carousel__btn prev" type="button" aria-label="Anterior">&lsaquo;</button>
    <button class="carousel__btn next" type="button" aria-label="Proximo">&rsaquo;</button>
    <div class="carousel__dots" role="tablist" aria-label="Paginacao"></div>
  </section>
</th:block>

<!-- Carrossel (com ids esperados pelo JS) -->
<th:block th:fragment="carouselVM(lista)">
  <section class="carousel" data-carousel>
    <div id="carousel-viewport" class="carousel__viewport" aria-live="polite">
      <div class="carousel__item" th:each="p : ${lista}">
        <img class="carousel__img"
             th:src="${p.imagem} ?: @{/img/produtos/placeholder-generico.png}"
             th:alt="${p.nome}" loading="lazy"
             onerror="this.src='/img/produtos/placeholder-generico.png'"/>
        <div class="carousel__info">
          <h3 class="carousel__title" th:text="${p.nome}">Nome</h3>
          <div class="price">
            <span class="new" th:text="${#numbers.formatCurrency(p.preco)}">R$ 0,00</span>
          </div>
          <a class="carousel__cta" th:href="@{'/produto/' + ${p.id}}">Ver produto</a>
        </div>
      </div>
    </div>
    <button id="carousel-prev" class="carousel__btn prev" type="button" aria-label="Anterior">‹</button>
    <button id="carousel-next" class="carousel__btn next" type="button" aria-label="Próximo">›</button>
    <div id="carousel-dots" class="carousel__dots" role="tablist" aria-label="Paginação"></div>
  </section>
</th:block>

<!-- Alias ::carousel(...) -->
<th:block th:fragment="carousel(lista)">
  <div th:replace="~{fragments/cards :: carouselVM(${lista})}"></div>
</th:block>

</body>
</html>
