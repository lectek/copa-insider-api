<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<th:block th:fragment="footer">
<footer class="ci-footer site-footer">
    <div class="ci-footer__inner">
        <p class="ci-footer__brand">Copa Insider</p>
        <p class="ci-footer__tagline">Tudo sobre a Copa do Mundo 2026</p>
        <nav class="ci-footer__links">
            <a th:href="@{/termos}" class="ci-footer__link">Termos de Uso</a>
            <a th:href="@{/privacidade}" class="ci-footer__link">Privacidade</a>
            <a th:href="@{/contato}" class="ci-footer__link">Contato</a>
        </nav>
        <p class="ci-footer__copy">&copy; 2026 Copa Insider. Todos os direitos reservados.</p>
    </div>
</footer>
<script>
(function () {
    document.querySelectorAll('.utc-time[data-utc-ms]').forEach(function (el) {
        var ms = parseInt(el.dataset.utcMs, 10);
        if (isNaN(ms)) return;
        el.textContent = new Date(ms).toLocaleTimeString(undefined, {
            hour: '2-digit', minute: '2-digit', hour12: false
        });
    });
}());
</script>
</th:block>

</body>
</html>
