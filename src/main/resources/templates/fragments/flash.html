<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<div th:fragment="flash" class="ci-flash-container">
    <div th:if="${successMessage}" class="ci-flash ci-flash--success" role="alert">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="ci-flash ci-flash--error" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${infoMessage}" class="ci-flash ci-flash--info" role="alert">
        <span th:text="${infoMessage}"></span>
    </div>
</div>

</body>
</html>
