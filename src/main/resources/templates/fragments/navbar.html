<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head><title>Copa Insider</title></head>
<body>

<nav th:fragment="public-navbar" class="ci-navbar">
    <div class="ci-navbar__inner">
        <a th:href="@{/}" class="ci-navbar__brand">
            <img th:src="@{/img/logo.svg}" alt="Copa Insider" class="ci-navbar__logo"/>
        </a>
        <ul class="ci-navbar__links">
            <li><a th:href="@{/palpites}" class="ci-navbar__link">Palpites</a></li>
            <li><a th:href="@{/ranking}" class="ci-navbar__link">Ranking</a></li>
            <li><a th:href="@{/partidas}" class="ci-navbar__link">Partidas</a></li>
            <li><a th:href="@{/grupos}" class="ci-navbar__link">Grupos</a></li>
        </ul>
        <div class="ci-navbar__actions">
            <a th:href="@{/login}" class="ci-btn ci-btn--outline ci-btn--sm">Entrar</a>
            <a th:href="@{/cadastro}" class="ci-btn ci-btn--primary ci-btn--sm">Criar conta</a>
        </div>
        <button class="ci-navbar__toggle" aria-label="Menu">&#9776;</button>
    </div>
</nav>

</body>
</html>
