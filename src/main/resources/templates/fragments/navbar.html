<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head><title>Copa Insider</title></head>
<body>

<nav th:fragment="public-navbar" class="ci-navbar">
    <div class="ci-navbar__inner">
        <a th:href="@{/}" class="ci-navbar__brand">
            <img th:src="@{/img/logo.svg}" alt="Copa Insider" class="ci-navbar__logo"/>
        </a>
        <ul class="ci-navbar__links">
            <li><a th:href="@{/calendario}" class="ci-navbar__link">Calendário</a></li>
            <li><a th:href="@{/selecoes}" class="ci-navbar__link">Seleções</a></li>
            <li><a th:href="@{/comparar}" class="ci-navbar__link">Comparar</a></li>
            <li><a th:href="@{/factos}" class="ci-navbar__link">Factos</a></li>
        </ul>
        <div class="ci-navbar__actions">
            <a th:href="@{/loja}" class="ci-btn ci-btn--primary ci-btn--sm">Ver guias</a>
        </div>
        <button class="ci-navbar__toggle" aria-label="Menu">&#9776;</button>
    </div>
</nav>

</body>
</html>
