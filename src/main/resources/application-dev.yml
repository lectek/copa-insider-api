spring:
  config:
    activate:
      on-profile: dev

  # ===== MySQL local (porta 3306) =====
  datasource:
    url: ${DEV_DATASOURCE_URL:jdbc:mysql://localhost:3306/copainsider?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DEV_DATASOURCE_USERNAME:root}
    password: ${DEV_DATASOURCE_PASSWORD:root}
    hikari:
      pool-name: mysqlHikari
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        # dialect: org.hibernate.dialect.MySQLDialect  # (opcional; o Boot detecta)

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

  thymeleaf:
    cache: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:dev-google-id}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:dev-google-secret}
            scope: [openid, profile, email]
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          facebook:
            client-id: ${OAUTH_FACEBOOK_CLIENT_ID:dev-facebook-id}
            client-secret: ${OAUTH_FACEBOOK_CLIENT_SECRET:dev-facebook-secret}
            scope: [public_profile, email]
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v19.0/dialog/oauth
            token-uri: https://graph.facebook.com/v19.0/oauth_access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture
            user-name-attribute: id

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}        # Mailpit em dev
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
          timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}
          quitwait: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_QUITWAIT:false}

  task:
    scheduling:
      pool:
        size: 2   # garante threads para EmailDeliveryWorker e outras @Scheduled

  data:
    redis:
      repositories:
        enabled: false

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    visibility:
      field: any
    # property-naming-strategy: LOWER_CAMEL_CASE  # (opcional)

  # ===== Kafka (auto-config do Spring) =====
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
    # Em dev, não definimos bootstrap-servers para não tentar conectar

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.http.converter.json: TRACE
    org.springframework.web.servlet.mvc.method.annotation: TRACE
    com.fasterxml.jackson.databind: DEBUG
    com.zaxxer.hikari: DEBUG

jwt:
  enabled: false
  issuer: ${JWT_ISSUER:copainsider-api}
  secret: ${JWT_SECRET:dev-secret-change-me}
  accessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
  refreshTokenExpirationMinutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:43200}

app:
  config:
    envProfileLabel: DEV
    networkPortLabel: HTTP
  security:
    oauth2:
      enabled: ${APP_OAUTH2_ENABLED:true}
      post-login-redirect: /
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:8080}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}     # envia para o Mailpit em dev
    from: ${APP_MAIL_FROM:CopaInsider <no-reply@local.copainsider>}

# ===== Kafka (propriedades custom do app) =====
kafka:
  enabled: false
  # enabled: true
  # bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  # client-id: copainsider-dev

# ===== Integrações externas =====
integrations:
  cliente:
    enabled: true
    base-url: ${INTEGRATIONS_CLIENTE_BASEURL:http://localhost:8080}
    max-in-memory-size: ${INTEGRATIONS_CLIENTE_MAX_MEMORY:10485760}
    read-timeout-ms: ${INTEGRATIONS_CLIENTE_READ_TIMEOUT:10000}
    write-timeout-ms: ${INTEGRATIONS_CLIENTE_WRITE_TIMEOUT:10000}
